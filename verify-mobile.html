<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 390×844 확인</title>
<style>
  html, body { margin: 0; background: #222; color: #ddd; font: 14px/1.5 -apple-system, sans-serif; }
  #wrap { display: flex; gap: 16px; padding: 12px; align-items: flex-start; }
  iframe { width: 390px; height: 844px; border: 2px solid #555; background: #000; display: block; }
  #report { max-width: 560px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  #report b { color: #f5a623; }
  #report .ok { color: #5ddc7a; }
  #report .bad { color: #ff7b72; }
</style>
</head>
<body>
<div id="wrap">
  <iframe id="f" src="./index.html?r=34a" title="앱"></iframe>
  <div id="report">측정 중...</div>
</div>
<script>
const f = document.getElementById('f');
const out = document.getElementById('report');
const lines = [];
function log(html) { lines.push(html); out.innerHTML = lines.join('\n'); }

function rect(w, sel) {
  const el = w.document.querySelector(sel);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return { x: +r.x.toFixed(1), y: +r.y.toFixed(1), w: +r.width.toFixed(1), h: +r.height.toFixed(1),
           top: +r.top.toFixed(1), bottom: +r.bottom.toFixed(1), left: +r.left.toFixed(1), right: +r.right.toFixed(1) };
}
function overlap(a, b) {
  if (!a || !b) return null;
  const w = Math.min(a.right, b.right) - Math.max(a.left, b.left);
  const h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
  return { overlapX: +Math.max(0, w).toFixed(1), overlapY: +Math.max(0, h).toFixed(1),
           area: +(Math.max(0, w) * Math.max(0, h)).toFixed(1) };
}
const pad = (w) => rect(w, '#dirPad');
const cmd = (w) => rect(w, '#cmdForm');
const bar = (w) => rect(w, '#viewbar');

function snap(tag) {
  const w = f.contentWindow;
  const p = pad(w), c = cmd(w), b = bar(w);
  const m = {
    tag,
    viewport: { w: w.innerWidth, h: w.innerHeight, dpr: w.devicePixelRatio },
    pad: p, cmd: c, viewbar: b,
    gapPadAboveCmd: p && c ? +(p.top - c.bottom).toFixed(1) : null,
    overlapPadCmd: overlap(p, c),
    overlapPadViewbar: overlap(p, b),
    within: p ? (p.left >= 0 && p.top >= 0 && p.right <= w.innerWidth && p.bottom <= w.innerHeight) : null,
    frameText: w.document.querySelector('#btnFrame').textContent,
    connText: w.document.querySelector('#btnConn').textContent,
    padStyle: w.document.querySelector('#dirPad').getAttribute('style'),
    saved: w.localStorage.getItem('smilePiping3D.padPos'),
  };
  (window.__snaps = window.__snaps || []).push(m);
  return m;
}

function fmt(m) {
  const c = (v) => (v === 0 ? '<span class="ok">' + v + '</span>' : '<span class="bad">' + v + '</span>');
  let s = '<b>' + m.tag + '</b> viewport ' + m.viewport.w + '×' + m.viewport.h + '\n'
    + '  dirPad  ' + JSON.stringify(m.pad) + '\n'
    + '  cmdBar  ' + JSON.stringify(m.cmd) + '\n'
    + '  viewbar ' + JSON.stringify(m.viewbar) + '\n'
    + '  pad top - cmd bottom = ' + m.gapPadAboveCmd + 'px\n'
    + '  pad∩cmd 면적 ' + c(m.overlapPadCmd ? m.overlapPadCmd.area : null) + 'px² · pad∩viewbar 면적 '
    + c(m.overlapPadViewbar ? m.overlapPadViewbar.area : null) + 'px² · 화면 안 ' + m.within + '\n'
    + '  라벨 ' + m.frameText + ' / ' + m.connText + ' · style ' + (m.padStyle || '(없음)') + ' · 저장 ' + m.saved;
  return s;
}

// ── 드래그 시험 (포인터 이벤트 시퀀스) ───────────────────────
function pointerDrag(handle, dx, dy) {
  const w = f.contentWindow;
  const h = w.document.querySelector(handle);
  const r = h.getBoundingClientRect();
  const x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
  const mk = (type, x, y) => new w.PointerEvent(type, {
    pointerId: 7, pointerType: 'touch', isPrimary: true, bubbles: true, cancelable: true,
    clientX: x, clientY: y, buttons: type === 'pointerup' ? 0 : 1,
  });
  h.dispatchEvent(mk('pointerdown', x0, y0));
  for (let i = 1; i <= 6; i++) {
    h.dispatchEvent(mk('pointermove', x0 + (dx * i) / 6, y0 + (dy * i) / 6));
  }
  h.dispatchEvent(mk('pointerup', x0 + dx, y0 + dy));
  h.dispatchEvent(new w.MouseEvent('click', { bubbles: true, cancelable: true, clientX: x0 + dx, clientY: y0 + dy }));
}

async function run() {
  const w = f.contentWindow;
  const d = w.document;
  lines.length = 0;
  if (location.search.indexOf('shot=1') >= 0) {
    log(fmt(snap('스크린샷용 — 기본 위치')));
    window.__done = true;
    return;
  }
  if (location.search.indexOf('drag=1') >= 0) {
    // 스크린샷용: 헤더를 끌어 오른쪽 위로 옮긴 상태만 남긴다
    pointerDrag('#padHead', 176, -300);
    await new Promise((r) => setTimeout(r, 120));
    log(fmt(snap('드래그 후 (스크린샷용)')));
    window.__done = true;
    return;
  }
  log(fmt(snap('① 기본 위치')));

  // ② 헤더를 잡고 오른쪽 위로 60, -160
  const before = {...snap('x')};
  pointerDrag('#padHead', 62, -150);
  await new Promise((r) => setTimeout(r, 60));
  const dragged = snap('② 헤더 드래그 (오른쪽 +62, 위 -150)');
  const movedBy = { dx: +(dragged.pad.left - before.pad.left).toFixed(1), dy: +(dragged.pad.top - before.pad.top).toFixed(1) };
  log(fmt(dragged) + '\n  실제 이동 dx=' + movedBy.dx + ' dy=' + movedBy.dy
      + ' · 버튼 라벨 그대로: ' + (dragged.frameText === before.frameText && dragged.connText === before.connText ? '✓' : '✗'));

  // ③ 화면 밖으로 크게 밀기 → clamp 확인
  pointerDrag('#padInfoRow', -900, 900);
  await new Promise((r) => setTimeout(r, 60));
  const clamped = snap('③ 화면 밖으로 밀기 (좌 -900, 아래 +900)');
  log(fmt(clamped));

  // ④ ⟲ 리셋 (드래그 직후 click 차단이 풀릴 때까지 잠깐 기다린다)
  await new Promise((r) => setTimeout(r, 520));
  w.document.querySelector('#padReset').click();
  await new Promise((r) => setTimeout(r, 80));
  const reset = snap('④ ⟲ 초기화');
  log(fmt(reset) + '\n  기본 자리로 복귀: '
      + (Math.abs(reset.pad.top - before.pad.top) < 0.6 && Math.abs(reset.pad.left - before.pad.left) < 0.6 ? '✓' : '✗'));

  // ⑤ 버튼 클릭은 그대로 동작하는지 (연결 방식 토글)
  w.document.querySelector('#btnConn').click();
  await new Promise((r) => setTimeout(r, 60));
  const toggled = w.document.querySelector('#btnConn').textContent;
  log('<b>⑤ 드래그 없이 탭</b> 연결 버튼 라벨: ' + toggled + (toggled.indexOf('단조') >= 0 ? ' ✓ (클릭 정상)' : ' ✗'));
  w.document.querySelector('#btnConn').click();
  await new Promise((r) => setTimeout(r, 40));

  // ⑥ 방향 버튼도 정상
  w.document.querySelector('#dirPad [data-dir="x:1"]').click();
  await new Promise((r) => setTimeout(r, 60));
  const info = w.document.querySelector('#padInfo').textContent;
  log('<b>⑥ 방향 → 탭</b> padInfo: ' + info);

  log('<b>콘솔 에러</b> ' + JSON.stringify(w.__errors || []));
  window.__done = true;
}

f.addEventListener('load', () => {
  let tries = 0;
  const t = setInterval(() => {
    tries++;
    const w = f.contentWindow;
    const p = w.document.querySelector('#dirPad');
    const c = w.document.querySelector('#cmdForm');
    if ((p && c && p.getBoundingClientRect().height > 0 && w.innerWidth === 390) || tries > 40) {
      clearInterval(t);
      setTimeout(() => { try { run(); } catch (e) { log('ERR ' + e.message + '\n' + (e.stack || '')); } }, 1200);
    }
  }, 150);
});
</script>
</body>
</html>
