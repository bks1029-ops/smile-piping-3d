<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검증 · 4분할 확대 타일 + 라인·거리감 보정</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f13; color: #dfe6ee;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', system-ui, sans-serif; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  #report { position: fixed; left: 14px; top: 14px; padding: 12px 14px; border-radius: 10px;
    background: rgba(12, 17, 22, .92); border: 1px solid #24303c; font-size: 12.5px; line-height: 1.6;
    max-width: 640px; white-space: pre-wrap; }
  #report b { color: #ffd166; }
  .ok { color: #7ee2a8; }
  .bad { color: #ff7b72; }
  #thumbs { position: fixed; left: 14px; bottom: 14px; display: flex; gap: 8px; align-items: flex-end;
    background: rgba(12, 17, 22, .92); border: 1px solid #24303c; border-radius: 10px; padding: 8px 10px; }
  #thumbs figure { margin: 0; text-align: center; }
  #thumbs img { display: block; width: 132px; height: 99px; object-fit: cover; border-radius: 5px; border: 1px solid #33404d; }
  #thumbs figcaption { font-size: 10.5px; color: #9fb0c0; margin-top: 3px; max-width: 132px; line-height: 1.3; }
  #thumbs figure.full img { border-color: #ffd166; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="report">검증 준비 중…</div>
<div id="thumbs"></div>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}
</script>
<script>
  window.__errors = window.__errors || [];
  window.addEventListener('error', (e) => window.__errors.push('error: ' + (e.message || e.error)));
  window.addEventListener('unhandledrejection', (e) => {
    window.__errors.push('promise: ' + ((e.reason && e.reason.message) || e.reason));
  });
  window.addEventListener('load', () => setTimeout(() => {
    const el = document.getElementById('report');
    if (el && !window.__verify) el.innerHTML = '<span class="bad">스크립트 오류: ' + window.__errors.join(' | ') + '</span>';
  }, 2500));
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { aiResultToScene, sanitizeAiScene } from './js/store.js?v=54';
import { buildScene } from './js/builders.js?v=54';
import { buildZoomTiles, buildAiImageParts, ZOOM_FRACTION, TILE_MAX_SIDE } from './js/zoom.js?v=54';

const pass = (b) => `<span class="${b ? 'ok' : 'bad'}">${b ? 'OK' : '실패'}</span>`;
const lines = [];

// ── ① 2000×1500 테스트 사진 만들기 ────────────────────────────────────
// 사분면마다 다른 색 + 가장자리 표식 + 작은 부품(밸브·플랜지) 무늬를 그려
// 잘라 낸 타일이 어느 자리에서 왔는지 픽셀 비교로 확인할 수 있게 한다.
const W = 2000, H = 1500;
const srcCanvas = document.createElement('canvas');
srcCanvas.width = W; srcCanvas.height = H;
const sctx = srcCanvas.getContext('2d');
sctx.fillStyle = '#2b3238'; sctx.fillRect(0, 0, W, H);
sctx.fillStyle = '#8d3a2c'; sctx.fillRect(0, 0, W / 2, H / 2);          // 좌상 적색
sctx.fillStyle = '#2f6b46'; sctx.fillRect(W / 2, 0, W / 2, H / 2);      // 우상 초록
sctx.fillStyle = '#2b4a86'; sctx.fillRect(0, H / 2, W / 2, H / 2);      // 좌하 파랑
sctx.fillStyle = '#b49a2e'; sctx.fillRect(W / 2, H / 2, W / 2, H / 2);  // 우하 노랑
sctx.fillStyle = '#c8ced4';
for (let i = 0; i < 22; i += 1) {                                        // 은색 배관 줄무늬
  sctx.fillRect(90 + i * 88, 240, 34, 900);
}
sctx.fillStyle = '#11161a';
sctx.beginPath(); sctx.arc(1000, 750, 180, 0, Math.PI * 2); sctx.fill(); // 가운데 구멍
sctx.fillStyle = '#dfe6ee';
sctx.font = '700 120px sans-serif';
sctx.fillText('TL', 120, 190); sctx.fillText('TR', 1660, 190);
sctx.fillText('BL', 120, 1380); sctx.fillText('BR', 1660, 1380);
const testPhoto = srcCanvas.toDataURL('image/jpeg', 0.92);

// ── ② buildZoomTiles / buildAiImageParts ─────────────────────────────
const tiles = await buildZoomTiles(testPhoto);
const parts1 = await buildAiImageParts([{ src: testPhoto, name: '현장 사진 1' }]);
const parts2 = await buildAiImageParts([
  { src: testPhoto, name: '현장 사진 1' },
  { src: testPhoto, name: '현장 사진 2' },
]);
const parts3 = await buildAiImageParts([
  { src: testPhoto, name: '1' }, { src: testPhoto, name: '2' }, { src: testPhoto, name: '3' },
]);

// 타일 픽셀 대조 — 타일 한가운데 영역의 평균색이 원본의 같은 자리 평균색과 같은지
const loadImg = (src) => new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
const avgPatch = (img, sx, sy, sw, sh) => {
  const c = document.createElement('canvas');
  c.width = 1; c.height = 1;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in g) g.imageSmoothingQuality = 'high';
  g.drawImage(img, sx, sy, sw, sh, 0, 0, 1, 1);
  return Array.from(g.getImageData(0, 0, 1, 1).data).slice(0, 3);
};
const tileChecks = [];
const cw = Math.floor(W * ZOOM_FRACTION), ch = Math.floor(H * ZOOM_FRACTION);
const origin = [[0, 0], [W - cw, 0], [0, H - ch], [W - cw, H - ch]];
for (let i = 0; i < tiles.length; i += 1) {
  const t = tiles[i];
  const im = await loadImg(t.src);
  let diff = null;
  const longSide = Math.max(t.width, t.height);
  if (im) {
    const pw = Math.max(8, Math.round(im.width * 0.06));
    const ph = Math.max(8, Math.round(im.height * 0.06));
    const a = avgPatch(im, (im.width - pw) / 2, (im.height - ph) / 2, pw, ph);
    const sw = Math.round(cw * 0.06), sh = Math.round(ch * 0.06);
    const b = avgPatch(srcCanvas, origin[i][0] + (cw - sw) / 2, origin[i][1] + (ch - sh) / 2, sw, sh);
    diff = Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1]), Math.abs(a[2] - b[2]));
  }
  tileChecks.push({ name: t.name, w: t.width, h: t.height, maxSideOk: longSide <= TILE_MAX_SIDE, diff });
}

const labels1 = parts1.map((p) => p.label);
const tilesOk = tiles.length === 4 && tileChecks.every((t) => t.maxSideOk && t.diff != null && t.diff <= 14);
const parts1Ok = parts1.length === 5 && parts1[0].label === '[전체 사진]'
  && /^\[확대 영역 1\/4: 좌상\]$/.test(parts1[1].label)
  && /^\[확대 영역 2\/4: 우상\]$/.test(parts1[2].label)
  && /^\[확대 영역 3\/4: 좌하\]$/.test(parts1[3].label)
  && /^\[확대 영역 4\/4: 우하\]$/.test(parts1[4].label);
const parts2Ok = parts2.length === 6 && parts2.filter((p) => p.kind === 'full').length === 2
  && parts2.filter((p) => p.kind === 'tile').length === 4
  && parts2[0].label === '[사진 1/2 · 전체 사진]'
  && /^\[사진 1\/2 · 확대 영역 1\/2: 좌상\]$/.test(parts2[1].label)
  && parts2[3].label === '[사진 2/2 · 전체 사진]'
  && /^\[사진 2\/2 · 확대 영역 1\/2: 우상\]$/.test(parts2[4].label);
const parts3Ok = parts3.length === 3 && parts3.every((p) => p.kind === 'full');

// ── ③ AI mock — 일부러 끊긴 배관 + 겹친 장비 ─────────────────────────
const MOCK = {
  layoutPlan: `1) 맨 뒤(−Z 2.2m)에 적색 스팀 헤더 HDR-101(2.4m×0.4m), 윗면 y=1.0.
2) 헤더 윗면 x=0에서 100A 수직관이 3.0m까지 올라간다.
3) 그 꼭대기에서 오른쪽으로 100A 수평관 — AI는 0.2m 어긋나게 뽑았다(끊긴 배관).
4) 그 수평관 중간 x=1.3에 50A 지관이 0.22m 못 미쳐 붙어 있다(구간 분기).
5) 앞줄에 펌프·드럼·제어반·열교환기 — AI는 z=0 근처 한 줄에 몰아넣어 겹쳤다.`,
  equipment: [
    { type: 'header', name: 'HDR-101 스팀 헤더', x: 0, y: 0, z: -2.2, w: 2.4, h: 0.4, d: 0.4, rot: 0, color: '#b04a35' },
    { type: 'pump', name: 'P-101 원심펌프', x: 0, y: 0, z: 0, w: 1.15, h: 0.85, d: 0.6, rot: 0, color: '#1f5fd0' },
    { type: 'tank', name: 'T-201 드럼', x: 0.5, y: 0, z: 0.1, w: 0.6, h: 0.9, d: 0.6, color: '#3a3f44' },
    { type: 'panel', name: 'MCC-1 제어반', x: 0.9, y: 0, z: 0.35, w: 1.2, h: 2.0, d: 0.7, color: '#9aa3ab' },
    { type: 'hx', name: 'E-101 열교환기', x: -1.2, y: 0, z: 0.0, w: 3.0, h: 0.75, d: 0.75, color: '#c8ced4' },
    { type: 'bfly', name: 'BF-101 버터플라이', x: 0, y: 2.0, z: -2.2, bore: '100A', axis: 'y', color: '#1f5fd0' }
  ],
  pipes: [
    { name: '100A 수직 분기', bore: '100A', material: 'carbon', color: '#b04a35',
      points: [{ x: 0, y: 1.0, z: -2.2 }, { x: 0, y: 3.0, z: -2.2 }] },
    // 꼭대기에서 0.2m 어긋나게 시작 — ②-b가 끝점끼리 붙여야 한다
    { name: '100A 상부 수평', bore: '100A', material: 'carbon',
      points: [{ x: 0.2, y: 3.0, z: -2.2 }, { x: 2.4, y: 3.0, z: -2.2 }] },
    // 위 끝이 수평관 구간에서 0.22m 떨어짐 — ②-b가 구간(티)에 붙여야 한다
    { name: '50A 지관', bore: '50A', material: 'sus',
      points: [{ x: 1.3, y: 1.0, z: -2.2 }, { x: 1.3, y: 2.78, z: -2.2 }] }
  ],
  notes: '헤더 + 수직 분기 + 끊긴 상부 수평 + 지관, 앞줄 겹친 설비'
};

const clean = sanitizeAiScene(MOCK);
const { equipment, pipes, report } = aiResultToScene(MOCK);
const state = { equipment, pipes, floorPlan: { visible: false } };

// 끊긴 배관이 붙었는지 (데이터)
const join = (name) => {
  const p = pipes.find((x) => x.name === name);
  return p ? p.points.map((q) => [+(q.x).toFixed(3), +(q.y).toFixed(3), +(q.z).toFixed(3)]) : null;
};
const cap = join('100A 상부 수평');
const branch = join('50A 지관');
const snapAOk = cap && Math.hypot(cap[0][0] - 0, cap[0][1] - 3.0, cap[0][2] + 2.2) < 1e-6;
const snapBOk = branch && Math.abs(branch[1][1] - 3.0) < 1e-6 && Math.abs(branch[1][0] - 1.3) < 1e-6;
const vert = join('100A 수직 분기');
// 수직관은 이음 과정에서 x,z가 끌려가 기울면 안 된다
const verticalOk = vert && Math.abs(vert[1][0]) < 1e-6 && Math.abs(vert[1][2] + 2.2) < 1e-6;

// 장비 이격 검사 — 최소 여백 0.15m까지 겹침이 풀렸는지
const boxOf = (e) => {
  const r = (((Math.round(e.rot || 0) % 360) + 360) % 360);
  const swap = r === 90 || r === 270;
  const hw = (swap ? e.d : e.w) / 2;
  const hd = (swap ? e.w : e.d) / 2;
  return { x0: e.x - hw, x1: e.x + hw, z0: e.z - hd, z1: e.z + hd, hw, hd };
};
const main = equipment.filter((e) => ['tank', 'pump', 'hx', 'panel'].includes(e.type));
const pairs = [];
for (let i = 0; i < main.length; i += 1) {
  for (let j = i + 1; j < main.length; j += 1) {
    const a = boxOf(main[i]);
    const b = boxOf(main[j]);
    const ox = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
    const oz = Math.min(a.z1, b.z1) - Math.max(a.z0, b.z0);
    pairs.push({ a: main[i].name, b: main[j].name, ox: +ox.toFixed(3), oz: +oz.toFixed(3), ok: ox <= 0.001 || oz <= 0.001 });
  }
}
const spreadOk = report.spread >= 2 && pairs.every((p) => p.ok);
const headerFixed = (() => {
  const h = equipment.find((e) => e.type === 'header');
  return h && Math.abs(h.x) < 1e-6 && Math.abs(h.z + 2.2) < 1e-6;
})();

// 배포 파일 상수 확인 (readImageFile 해상도 상향)
let resOk = false;
try {
  const txt = await (await fetch('./js/main.js?v=54')).text();
  resOk = /const MAX_SIDE = 2048;/.test(txt) && /const QUALITY = 0\.86;/.test(txt);
} catch (e) { resOk = false; }

// ── ④ 3D 렌더 ────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0f13');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0.3, 1.3, -0.6);
camera.position.set(4.6, 4.2, 5.4);
controls.update();

scene.add(new THREE.HemisphereLight('#dfe9f4', '#1b232b', 0.55));
const sun = new THREE.DirectionalLight('#fff6e8', 1.6);
sun.position.set(4, 7, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: '#1a2027', roughness: 0.95, metalness: 0.05 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(40, 40, 0x2b3742, 0x1d262e);
grid.position.y = 0.002;
scene.add(grid);

const root = buildScene(state);
scene.add(root);

window.__setCam = (px, py, pz, tx, ty, tz) => {
  camera.position.set(px, py, pz);
  controls.target.set(tx, ty, tz);
  controls.update();
};

const errors = window.__errors || [];
window.__verify = {
  tiles: tileChecks, labels1, labels2: parts2.map((p) => p.label),
  parts: { one: parts1.length, two: parts2.length, three: parts3.length },
  report, snapAOk, snapBOk, verticalOk, spreadOk, headerFixed, resOk, pairs, errors,
  equipment: equipment.map((e) => ({ name: e.name, type: e.type, x: e.x, z: e.z })),
  pipes: pipes.map((p) => ({ name: p.name, points: p.points })),
};

lines.push('<b>스마일산업 3D 배관 · 4분할 확대 + 라인·거리감 검증 (v54)</b>');
lines.push(`① 고해상도 상향(MAX_SIDE 2048 · 0.86) ${pass(resOk)}`);
lines.push(`② 2000×1500 사진 → 확대 타일 ${tiles.length}장 ${pass(tilesOk)} ${tileChecks.map((t) => `${t.name} ${t.w}×${t.h}(차이 ${t.diff})`).join(' · ')}`);
lines.push(`③ 사진 1장 → 전체 1 + 타일 4 = ${parts1.length}장 ${pass(parts1Ok)}  라벨 ${labels1.join(' ')}`);
lines.push(`④ 사진 2장 → ${parts2.length}장(전체 2 + 타일 4) ${pass(parts2Ok)} · 사진 3장 → ${parts3.length}장(확대 생략) ${pass(parts3Ok)}`);
lines.push(`⑤ 끊긴 배관 끝 붙임: 상부 수평 ${pass(!!snapAOk)} · 지관→구간(티) ${pass(!!snapBOk)} · 수직관 안 기움 ${pass(!!verticalOk)} (snapped ${report.snapped}곳)`);
lines.push(`⑥ 겹친 장비 이격 ${pass(spreadOk)} (spread ${report.spread}대) · 헤더는 그대로 ${pass(!!headerFixed)}`);
pairs.forEach((p) => lines.push(`    ${p.a} ↔ ${p.b}  겹침 ${p.ox}×${p.oz} ${pass(p.ok)}`));
lines.push(`⑦ 3D 렌더 · 콘솔 오류 ${errors.length}건 ${pass(errors.length === 0)}`);
document.getElementById('report').innerHTML = lines.join('\n');

// 썸네일 — 전체 사진 + 확대 타일 4장
const thumbs = document.getElementById('thumbs');
thumbs.innerHTML = parts1.map((p) => `
  <figure class="${p.kind === 'full' ? 'full' : ''}">
    <img src="${p.src}" alt="${p.name || ''}">
    <figcaption>${p.label ? p.label.replace(/^\[|\]$/g, '') : ''}</figcaption>
  </figure>`).join('');

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
});

function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
