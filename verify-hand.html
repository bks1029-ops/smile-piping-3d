<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>손 그리기 드래그 자체 검증</title>
<style>
  html, body { margin: 0; background: #1b1f24; color: #ddd; font: 13px/1.45 -apple-system, sans-serif; }
  #wrap { padding: 10px; }
  iframe { width: 1000px; max-width: 100%; height: 640px; border: 2px solid #555; background: #000; display: block; }
  #report { margin-top: 8px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; max-height: 260px; overflow: auto; }
  #report b { color: #f5a623; }
</style>
</head>
<body>
<div id="wrap">
  <iframe id="f" src="./index.html?view=iso" title="앱"></iframe>
  <div id="report">준비 중...</div>
</div>
<script>
// 앱의 손 그리기 드래그 경로를 실제 PointerEvent로 구동해 결과를 확인하는 임시 검증 페이지.
const f = document.getElementById('f');
const out = document.getElementById('report');
const log = [];

f.addEventListener('load', () => setTimeout(run, 1600));
// iframe이 이미 다 올라온 뒤에 이 스크립트가 실행되면 load 이벤트를 놓친다.
if (f.contentDocument && f.contentDocument.readyState === 'complete') setTimeout(run, 1600);

function run() {
  if (window.__ran) return;
  window.__ran = true;
  const w = f.contentWindow;
  const app = w.__app;
  if (!app) { window.__ran = false; setTimeout(run, 500); return; }
  const c = w.document.querySelector('#scene');
  const frame = () => new Promise((r) => w.requestAnimationFrame(() => r()));
  const ev = (type, x, y) => c.dispatchEvent(new w.PointerEvent(type, {
    pointerId: 11, pointerType: 'touch', isPrimary: true, bubbles: true, cancelable: true,
    clientX: x, clientY: y, button: 0, buttons: type === 'pointerup' ? 0 : 1,
  }));

  (async () => {
    w.document.querySelector('#cmdClear').click();     // 새 도면
    await frame(); await frame();
    w.document.querySelector('#btnHand').click();      // ✏️ 손 그리기
    await frame(); await frame();
    log.push({
      step: '1) 손 그리기 ON',
      handMode: app.handMode,
      enableRotate: app.controls.enableRotate,
      badgeShown: !w.document.querySelector('#handBadge').hidden,
      btnActive: w.document.querySelector('#btnHand').classList.contains('active'),
    });

    const rect = c.getBoundingClientRect();
    const drag = async (v, px, idx) => {
      const a = app.handAnchor || { x: 0, y: 0, z: 0 };
      const s0 = app.projectToScreen(a, rect);
      const p1 = app.projectToScreen({ x: a.x + v[0], y: a.y + v[1], z: a.z + v[2] }, rect);
      let ux = p1.x - s0.x, uy = p1.y - s0.y;
      const L = Math.hypot(ux, uy) || 1;
      ux /= L; uy /= L;
      const S = { x: rect.left + s0.x, y: rect.top + s0.y };
      ev('pointerdown', S.x, S.y);
      await frame();
      let last = S;
      for (let i = 1; i <= 8; i += 1) {
        last = { x: S.x + (ux * px * i) / 8, y: S.y + (uy * px * i) / 8 };
        ev('pointermove', last.x, last.y);
        await frame();
      }
      const tipEl = w.document.querySelector('#handTip');
      const mid = {
        tipText: tipEl.hidden ? null : tipEl.textContent,
        previewVisible: app.handPreviewGroup.visible,
        preview: app.handPreview ? { axis: app.handPreview.axis, sign: app.handPreview.sign, mm: app.handPreview.mm } : null,
      };
      ev('pointerup', last.x, last.y);
      await frame(); await frame();
      const pipes = app.state.pipes;
      log.push({
        step: `2-${idx}) 드래그 ${v.join('/')}`,
        start: [a.x, a.y, a.z],
        mid,
        pipes: pipes.length,
        equip: app.state.equipment.map((e) => e.type),
        anchor: app.handAnchor ? [app.handAnchor.x, app.handAnchor.y, app.handAnchor.z] : null,
        lastPipePoints: pipes.length ? pipes[pipes.length - 1].points.map((p) => [p.x, p.y, p.z]) : null,
      });
    };
    await drag([1, 0, 0], 190, 1);
    await drag([0, 0, 1], 190, 2);
    await drag([0, 1, 0], 150, 3);

    log.push({ step: '3) 결과', errors: (w.__errors || []).slice() });
    window.__handTest = log;
    out.textContent = JSON.stringify(log, null, 1);
  })().catch((e) => { out.textContent = 'ERR ' + e.message + '\n' + e.stack; });
}
</script>
</body>
</html>
