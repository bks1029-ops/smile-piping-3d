<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v56 검증 (임시)</title>
<style>
  body { margin: 0; background: #1b1f24; color: #e7ecf2; font: 13px/1.5 -apple-system, "Malgun Gothic", sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid #38414c; }
  .bar button { padding: 6px 10px; border-radius: 6px; border: 1px solid #4a5563; background: #2c343d; color: #e7ecf2; cursor: pointer; }
  pre { margin: 0; padding: 10px 12px; white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; color: #b7e4c7; }
  iframe { display: block; width: 390px; height: 844px; border: 0; margin: 10px; background: #000; }
</style>
</head>
<body>
<div class="bar">
  <button id="btnOpen">☰ 서랍 열기(iframe)</button>
  <button id="btnAi">AI 사진 창 열기(iframe)</button>
  <button id="btnBack">iframe 뒤로가기</button>
  <button id="btnClose">모두 닫기</button>
  <span id="state"></span>
</div>
<pre id="out">검사 중…</pre>
<iframe id="fr" src="./index.html?cb=56" width="390" height="844"></iframe>
<script type="module">
import { buildAiImageParts } from './js/zoom.js?v=56';

const fr = document.getElementById('fr');
const out = document.getElementById('out');
const stateEl = document.getElementById('state');
const lines = [];
const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };

fr.addEventListener('load', () => log('iframe 로드: ' + fr.contentWindow.location.href));

// 작은 이미지 data URL 하나 만들기
function makeImage(color) {
  const c = document.createElement('canvas');
  c.width = 240; c.height = 160;
  const x = c.getContext('2d');
  x.fillStyle = color; x.fillRect(0, 0, 240, 160);
  x.fillStyle = '#fff'; x.fillRect(20, 20, 80, 30);
  const url = c.toDataURL('image/jpeg', 0.8);
  c.width = 0; c.height = 0;
  return url;
}

const img1 = makeImage('#2f6f4f');
const img2 = makeImage('#7a3b2e');
const img3 = makeImage('#3b4f7a');

for (const [name, list] of [
  ['사진 1장', [img1]],
  ['사진 2장', [img1, img2]],
  ['사진 3장', [img1, img2, img3]],
]) {
  const parts = await buildAiImageParts(list);
  const kinds = parts.map((p) => p.kind);
  log(`${name} → 보내는 이미지 ${parts.length}장 · kind=${JSON.stringify(kinds)} · tile ${kinds.filter((k) => k === 'tile').length}장 · 라벨 ${JSON.stringify(parts.map((p) => p.label))}`);
}

stateEl.textContent = '준비 완료';
document.getElementById('btnOpen').addEventListener('click', () => {
  fr.contentWindow.__app.setDrawerOpen(true);
});
document.getElementById('btnAi').addEventListener('click', () => {
  fr.contentWindow.__app.openAiPhotos();
});
document.getElementById('btnBack').addEventListener('click', () => {
  fr.contentWindow.history.back();
});
document.getElementById('btnClose').addEventListener('click', () => {
  const a = fr.contentWindow.__app;
  a.setDrawerOpen(false);
  a.closeModal();
});
</script>
</body>
</html>
