<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v57 검증 (임시)</title>
<style>
  html, body { margin: 0; background: #1b1f24; color: #e7ecf2; font: 13px/1.5 -apple-system, "Malgun Gothic", sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: #000; }
  iframe { display: block; width: 390px; height: 844px; border: 0; }
  #bar { position: absolute; left: 0; top: 850px; width: 780px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; }
  #bar button { padding: 6px 10px; border-radius: 6px; border: 1px solid #4a5563; background: #2c343d; color: #e7ecf2; cursor: pointer; }
  #out { position: absolute; left: 0; top: 920px; width: 780px; font: 12px/1.5 ui-monospace, monospace; color: #b7e4c7; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="stage"><iframe id="fr" src="./index.html?cb=57v" width="390" height="844"></iframe></div>
<div id="bar">
  <button id="btnDrawer">서랍 열기</button>
  <button id="btnAiTab">AI 탭</button>
  <button id="btnPlan">테스트 도면 깔기</button>
  <span id="state">준비 중…</span>
</div>
<pre id="out"></pre>

<script>
const fr = document.getElementById('fr');
const out = document.getElementById('out');
const stateEl = document.getElementById('state');
const log = (s) => { out.textContent += s + '\n'; };
window.__errs = [];

fr.addEventListener('load', () => {
  const w = fr.contentWindow;
  if (!w || !w.__app) return;
  // 검증용: 사용자의 실제 저장 상태(localStorage)를 건드리지 않도록 저장을 끈다.
  try { w.__app.scheduleSave = () => {}; w.__app.flushSave = () => {}; } catch (e) {}
  w.addEventListener('error', (e) => window.__errs.push('error: ' + (e.message || e.type)));
  w.addEventListener('unhandledrejection', (e) => window.__errs.push('rejection: ' + ((e.reason && e.reason.message) || e.reason)));
  const ce = w.console.error.bind(w.console);
  w.console.error = (...a) => { window.__errs.push('console.error: ' + a.map(String).join(' ')); ce(...a); };
  stateEl.textContent = '앱 준비 완료 · 저장 꺼짐';
  log('iframe 로드: ' + w.location.href);
});

function makePlanImage() {
  const c = document.createElement('canvas');
  c.width = 800; c.height = 560;
  const g = c.getContext('2d');
  g.fillStyle = '#f7f7f4'; g.fillRect(0, 0, 800, 560);
  g.strokeStyle = '#cfd4db'; g.lineWidth = 1;
  for (let x = 0; x <= 800; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 560); g.stroke(); }
  for (let y = 0; y <= 560; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(800, y); g.stroke(); }
  g.strokeStyle = '#1f2937'; g.lineWidth = 3;
  g.strokeRect(60, 60, 680, 440);
  g.lineWidth = 2;
  g.strokeRect(110, 120, 200, 120); g.strokeRect(470, 120, 220, 120);
  g.strokeRect(110, 330, 250, 110); g.strokeRect(470, 330, 220, 110);
  g.strokeStyle = '#2f6f4f'; g.lineWidth = 6;
  g.beginPath(); g.moveTo(310, 180); g.lineTo(470, 180); g.moveTo(310, 385); g.lineTo(470, 385); g.stroke();
  const url = c.toDataURL('image/jpeg', 0.85);
  c.width = 0; c.height = 0;
  return url;
}

document.getElementById('btnDrawer').addEventListener('click', () => {
  fr.contentWindow.__app.setDrawerOpen(true);
});
document.getElementById('btnAiTab').addEventListener('click', () => {
  const doc = fr.contentWindow.document;
  doc.querySelector('#tabs .tab[data-tab="plan"]').click();
});
document.getElementById('btnPlan').addEventListener('click', () => {
  fr.contentWindow.__app.applyPlanImage(makePlanImage());
  stateEl.textContent = '도면 깔기 완료';
});
</script>
</body>
</html>
