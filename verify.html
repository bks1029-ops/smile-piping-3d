<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>검증 — 밸브 관경 비례 · 손 그리기 치수 창</title>
<style>
  html, body { margin: 0; padding: 0; background: #101418; color: #dfe7ee; font: 12px/1.4 -apple-system, "Malgun Gothic", sans-serif; }
  #stage { display: block; width: 390px; height: 844px; border: 0; background: #0b0f13; }
  #report { margin: 0; padding: 8px 10px; white-space: pre-wrap; font: 11px/1.35 ui-monospace, monospace; color: #9fe8c4; width: 900px; }
</style>
</head>
<body>
<iframe id="stage" src="./index.html?v=42&verify=1" width="390" height="844" title="앱"></iframe>
<pre id="report">loading…</pre>
<script>
// t=A : 관경별 볼밸브(25A·100A·200A) 크기 비교 장면
// t=B : 손 그리기로 짧은 구간을 그리고 치수(mm) 창 확인 — 화면 오른쪽 가장자리에서
const SCEN = new URLSearchParams(location.search).get('t') || 'A';
const TICK = (ms) => new Promise((r) => setTimeout(r, ms || 150));
const out = (label, data) => {
  const el = document.getElementById('report');
  el.textContent = el.textContent.replace('loading…', '') + '\n' + label + ' ' + JSON.stringify(data);
  document.title = 'verify ' + SCEN + ' ' + label;
};
const frame = () => {
  const f = document.getElementById('stage');
  return { f, w: f.contentWindow, app: f.contentWindow.__app };
};

// 3D 그룹의 실제 크기(m) — 메시 꼭짓점을 월드로 옮겨 잰다
function bboxOf(w, group) {
  const V = w.__app.camera.position.constructor;
  const v = new V();
  const min = [1e9, 1e9, 1e9];
  const max = [-1e9, -1e9, -1e9];
  group.updateMatrixWorld(true);
  group.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    const g = o.geometry;
    if (!g.boundingBox) g.computeBoundingBox();
    const bb = g.boundingBox;
    if (!bb) return;
    [bb.min.x, bb.max.x].forEach((x) => [bb.min.y, bb.max.y].forEach((y) => [bb.min.z, bb.max.z].forEach((z) => {
      v.set(x, y, z).applyMatrix4(o.matrixWorld);
      min[0] = Math.min(min[0], v.x); min[1] = Math.min(min[1], v.y); min[2] = Math.min(min[2], v.z);
      max[0] = Math.max(max[0], v.x); max[1] = Math.max(max[1], v.y); max[2] = Math.max(max[2], v.z);
    })));
  });
  return [0, 1, 2].map((i) => Math.round((max[i] - min[i]) * 1000) / 1000);
}

const OD = { '15A': 21.7, '20A': 27.2, '25A': 34.0, '32A': 42.7, '40A': 48.6, '50A': 60.5, '65A': 76.3, '80A': 89.1, '100A': 114.3, '125A': 139.8, '150A': 165.2, '200A': 216.3, '250A': 267.4, '300A': 318.5, '600A': 609.6 };

async function scenA() {
  const { w, app } = frame();
  app.clearAll({ silent: true });
  await TICK(150);
  // 세로 배관 세 줄을 나란히 — 정면에서 보면 굵기와 밸브 크기를 나란히 견줄 수 있다.
  [['25A', -0.55], ['100A', 0], ['200A', 0.55]].forEach(([bore, x]) => {
    app.setCmdCursor({ x, y: 0.3, z: 0 }, true);
    app.runCommandLine(bore.toLowerCase() + ' 볼벨브 위로 600');
  });
  app.clearSelection();
  app.setView('front', true);
  await TICK(300);
  app.camera.position.lerp(app.controls.target, 0.1);
  app.controls.update();
  await TICK(400);

  const valves = [];
  app.state.equipment.filter((e) => e.type === 'ball').forEach((e) => {
    const g = app.root.children.find((c) => c.userData && c.userData.pick && c.userData.pick.id === e.id);
    const size = g ? bboxOf(w, g) : null;
    const pipe = app.state.pipes.find((p) => Math.abs(p.points[0].x - e.x) < 0.02 && Math.abs(p.points[0].z - e.z) < 0.02);
    const od = (pipe && OD[pipe.bore]) || 0;
    valves.push({
      bore: e.bore, pipe: pipe ? pipe.bore : null, pipeOdMm: od,
      specWH: [e.w, e.h], sizeM: size,
      lenOverPipeD: size && od ? Math.round((size[0] * 1000 / od) * 100) / 100 : null,
    });
  });
  out('A', { valves, errors: w.__errors || [] });
}

async function scenB() {
  const { w, app } = frame();
  app.clearAll({ silent: true });
  app.setView('top', true);
  app.setHandMode(true, true);
  await TICK(400);

  const c = app.renderer.domElement;
  const r = c.getBoundingClientRect();
  const PE = w.PointerEvent;
  const ev = (type, x, y) => new PE(type, {
    clientX: r.left + x, clientY: r.top + y, pointerId: 9,
    pointerType: 'touch', isPrimary: true, bubbles: true, cancelable: true,
  });
  // 화면 오른쪽 가장자리 가까이에서 짧게 끈다 — 예전에는 이 자리에서 폭이 잘려 숫자칸이 0으로 줄었다.
  c.dispatchEvent(ev('pointerdown', 306, 470));
  c.dispatchEvent(ev('pointermove', 356, 470));
  c.dispatchEvent(ev('pointerup', 356, 470));
  await TICK(350);

  const doc = w.document;
  const form = doc.querySelector('#handDim');
  const inp = doc.querySelector('#handDimInput');
  const rect = (el) => { const b = el.getBoundingClientRect(); return { l: Math.round(b.left), t: Math.round(b.top), r: Math.round(b.right), b: Math.round(b.bottom), w: Math.round(b.width), h: Math.round(b.height) }; };
  const inter = (a, b) => Math.max(0, Math.min(a.r, b.r) - Math.max(a.l, b.l)) * Math.max(0, Math.min(a.b, b.b) - Math.max(a.t, b.t));
  const res = { open: !!(form && !form.hidden) };
  if (res.open) {
    res.valueShown = inp.value;
    const cs = w.getComputedStyle(inp);
    const fr = rect(form);
    res.form = fr;
    res.inViewport = fr.l >= 0 && fr.t >= 0 && fr.r <= 390 && fr.b <= 844;
    res.overlapPx = ['#dirPad', '#cmdForm', '#viewbar'].reduce((s, sel) => {
      const el = doc.querySelector(sel);
      return s + (el && !el.hidden ? Math.round(inter(fr, rect(el))) : 0);
    }, 0);
    res.input = { w: inp.clientWidth, font: cs.fontSize, color: cs.color, bg: cs.backgroundColor };
    // 3~5자리 — 숫자가 잘리지 않는지 (scrollWidth가 폭 안에 들어오는지)
    res.digits = ['180', '1500', '12000'].map((v) => {
      inp.value = v;
      return { v, fits: inp.scrollWidth <= inp.clientWidth + 1, scrollW: inp.scrollWidth, w: inp.clientWidth };
    });
    // 예전 CSS(폭 고정 없음 + 전역 input 규칙)를 흉내 내 원인 확인
    form.style.width = 'auto';
    form.style.maxWidth = 'none';
    inp.style.width = '100%';
    inp.style.minWidth = '0';
    inp.style.fontSize = '13px';
    await TICK(80);
    const fr2 = rect(form);
    res.before = { formW: fr2.w, inputW: inp.clientWidth, scrollW: inp.scrollWidth };
    form.style.width = '';
    form.style.maxWidth = '';
    inp.style.width = '';
    inp.style.minWidth = '';
    inp.style.fontSize = '';
    // 스크린샷용 — 네 자리 숫자를 넣어 둔다
    inp.value = '1500';
    inp.focus();
    await TICK(150);
  }
  res.errors = w.__errors || [];
  out('B', res);
}

(async () => {
  const f = document.getElementById('stage');
  for (let i = 0; i < 150; i += 1) {
    if (f.contentWindow && f.contentWindow.__app && f.contentWindow.__app.root) break;
    await TICK(100);
  }
  await TICK(300);
  try {
    if (SCEN === 'B') await scenB();
    else await scenA();
  } catch (e) {
    out('ERR', { message: String(e && e.message || e), stack: String(e && e.stack || '').slice(0, 400) });
  }
})();
</script>
</body>
</html>
