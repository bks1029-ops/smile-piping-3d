<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v59 검증 (임시) — 도면 충실도</title>
<style>
  html, body { margin: 0; background: #1b1f24; color: #e7ecf2; font: 13px/1.5 -apple-system, "Malgun Gothic", sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: #000; overflow: hidden; }
  #fr { display: block; width: 390px; height: 844px; border: 0; }
  #panel { position: absolute; left: 6px; top: 6px; width: 302px; padding: 5px 7px; border-radius: 7px;
           background: rgba(12,16,20,.85); border: 1px solid #37414d; font: 9px/1.3 ui-monospace, monospace;
           color: #bfe6c7; pointer-events: none; }
  #panel b { display: block; margin-bottom: 2px; color: #e7ecf2; font: 10px/1.4 -apple-system, "Malgun Gothic", sans-serif; }
  #panel .no { color: #ff9d8a; }
  #panel .dim { color: #8b97a4; }
  #out { position: absolute; left: 400px; top: 8px; width: 900px; margin: 0; font: 12px/1.5 ui-monospace, monospace;
         color: #b7e4c7; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="stage">
  <iframe id="fr" src="./index.html?cb=59v" width="390" height="844"></iframe>
  <div id="panel"><b>v59 자동 검증 · 390×844</b><div id="lines">준비 중…</div></div>
</div>
<pre id="out"></pre>

<script type="module">
import { sanitizeAiScene } from './js/store.js?v=59b';

const fr = document.getElementById('fr');
const out = document.getElementById('out');
const linesEl = document.getElementById('lines');
const log = (s) => { out.textContent += s + '\n'; };
const lines = [];
const result = { checks: [], ok: true, detail: {} };
window.__verdict = result;
window.__errs = [];

// ── ① 도면(drawing) 응답: 단품 열교환기 제작도 ────────────────────────────────
// 도면에는 E-101 한 대와 N1~N4 노즐(플랜지로 짧게 마감)만 있다. 밸브·계기·주변 배관은 없다.
// AI가 예전처럼 "노즐에서 나가는 긴 배관"을 상상해 늘리거나 노즐끼리 잇지 않았는지 확인한다.
const DRAWING = {
  inputKind: 'drawing',
  layoutPlan: '1) 단품 제작도: 쉘앤튜브 열교환기 E-101 1대(쉘 3,000mm × 750mm).\n2) 노즐 N1(150A)·N2(100A)는 쉘 윗면에서 250·300mm 수직으로 올라와 플랜지로 마감.\n3) 노즐 N3(65A)는 쉘 옆면에서 200mm 수평, N4(20A)는 쉘 밑면에서 아래로 165mm 드레인.',
  equipment: [
    { type: 'hx', name: 'E-101 쉘앤튜브 열교환기', x: 0, y: 0, z: 0, w: 3.0, h: 0.75, d: 0.75, rot: 0 },
    { type: 'flange', name: 'N1 150A 플랜지', x: -1.0, y: 1.465, z: 0, bore: '150A', axis: 'y' },
    { type: 'flange', name: 'N2 100A 플랜지', x: 1.0, y: 1.515, z: 0, bore: '100A', axis: 'y' },
    { type: 'flange', name: 'N3 65A 플랜지', x: 1.7, y: 0.84, z: 0, bore: '65A', axis: 'x' },
    { type: 'flange', name: 'N4 20A 플랜지', x: 0, y: 0.30, z: 0, bore: '20A', axis: 'y' },
  ],
  pipes: [
    { name: 'N1 150A 노즐', bore: '150A', material: 'carbon',
      points: [{ x: -1.0, y: 1.215, z: 0 }, { x: -1.0, y: 1.465, z: 0 }] },
    { name: 'N2 100A 노즐', bore: '100A', material: 'carbon',
      points: [{ x: 1.0, y: 1.215, z: 0 }, { x: 1.0, y: 1.515, z: 0 }] },
    { name: 'N3 65A 노즐', bore: '65A', material: 'carbon',
      points: [{ x: 1.5, y: 0.84, z: 0 }, { x: 1.7, y: 0.84, z: 0 }] },
    { name: 'N4 20A 드레인', bore: '20A', material: 'carbon',
      points: [{ x: 0, y: 0.465, z: 0 }, { x: 0, y: 0.30, z: 0 }] },
  ],
  notes: '도면 그대로 — 노즐 N1~N4를 짧은 플랜지로 마감',
};

// ── ② 현장 사진(photo) + 노즐 안전장치: 헤더 위 0.3m 노즐 2개가 0.35m 간격 ──────
// 예전 보정은 두 노즐 끝을 서로 끌어당겨 꺾어 붙였다(짧은 노즐이 옆으로 휘는 그림).
const PHOTO_NOZZLE = {
  inputKind: 'photo',
  layoutPlan: '1) 가로 헤더 HDR-101(2,000mm). 2) 헤더 윗면에서 150A 노즐 2개가 300mm 올라와 플랜지로 끝난다.',
  equipment: [
    { type: 'header', name: 'HDR-101 스팀 헤더', x: 0, y: 0, z: 0, w: 2.0, h: 0.4, d: 0.4, rot: 0, color: '#b04a35' },
    { type: 'flange', name: 'N-1 150A 플랜지', x: -0.2, y: 1.3, z: 0, bore: '150A', axis: 'y' },
    { type: 'flange', name: 'N-2 150A 플랜지', x: 0.15, y: 1.3, z: 0, bore: '150A', axis: 'y' },
  ],
  pipes: [
    { name: 'N-1 150A 노즐', bore: '150A', material: 'carbon',
      points: [{ x: -0.2, y: 1.0, z: 0 }, { x: -0.2, y: 1.3, z: 0 }] },
    { name: 'N-2 150A 노즐', bore: '150A', material: 'carbon',
      points: [{ x: 0.15, y: 1.0, z: 0 }, { x: 0.15, y: 1.3, z: 0 }] },
  ],
  notes: '',
};

// ── ③ 현장 사진(photo) ㄷ자 분기 — v58에서 검증한 그 구조(그대로 동작해야 한다) ──────
const PHOTO_BRANCH = {
  inputKind: 'photo',
  layoutPlan: '1) 앞쪽 아래 450A 은색 보온 가로관, 뒤쪽 300A 보온 가로관.\n2) 450A 위에서 50A 수직관이 게이트밸브를 지나 ㄷ자로 꺾여 뒤쪽 300A에 합류.',
  equipment: [
    { type: 'valve', name: 'GV-201 게이트밸브', x: 0.0, y: 1.35, z: 0, axis: 'y', bore: '50A', color: '#3a3f44' },
    { type: 'valve', name: 'GV-202 게이트밸브', x: 0.8, y: 1.4, z: 0, axis: 'y', bore: '50A', color: '#3a3f44' },
    { type: 'gauge', name: 'PG-201 압력계', x: 0.25, y: 1.7, z: 0.2 },
  ],
  pipes: [
    { name: '450A 은색 보온 가로관', bore: '450A', material: 'sus', color: '#c8ced4',
      points: [{ x: -1.2, y: 0.8, z: 0 }, { x: 1.2, y: 0.8, z: 0 }] },
    { name: '300A 보온 후면 주배관', bore: '300A', material: 'sus', color: '#c8ced4',
      points: [{ x: -1.0, y: 1.35, z: 1.3 }, { x: 1.0, y: 1.35, z: 1.3 }] },
    { name: '50A ㄷ자 우회 A', bore: '50A', material: 'carbon', color: '#3a3f44',
      points: [
        { x: 0.0, y: 0.8, z: 0 },
        { x: 0.0, y: 1.95, z: 0 },
        { x: 0.45, y: 1.95, z: 0 },
        { x: 0.45, y: 1.95, z: 1.3 },
        { x: 0.45, y: 1.72, z: 1.3 },
      ] },
    { name: '50A ㄷ자 우회 B', bore: '50A', material: 'carbon', color: '#3a3f44',
      points: [
        { x: 0.8, y: 0.8, z: 0 },
        { x: 0.8, y: 1.9, z: 0 },
        { x: 0.8, y: 1.9, z: 1.35 },
        { x: 0.8, y: 1.58, z: 1.52 },
      ] },
  ],
  notes: '',
};

const pipeLen = (p) => {
  let L = 0;
  for (let i = 1; i < p.points.length; i += 1) {
    const a = p.points[i - 1], b = p.points[i];
    L += Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
  }
  return L;
};
const ends = (p) => [p.points[0], p.points[p.points.length - 1]];
const near = (a, b, tol) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z) <= tol;
const check = (label, ok, dim) => {
  result.checks.push({ label, ok: !!ok, dim: dim || '' });
  if (!ok) result.ok = false;
  lines.push(`<div class="${ok ? 'ok' : 'no'}">${ok ? 'OK' : 'NG'} · ${label}${dim ? ` <span class="dim">${dim}</span>` : ''}</div>`);
  linesEl.innerHTML = lines.join('');
  log(`${ok ? 'OK' : 'NG'}  ${label}  ${dim || ''}`);
};

async function run() {
  const w = fr.contentWindow;
  if (!w || !w.__app) { log('iframe 앱을 찾지 못했습니다'); return; }
  try { w.__app.scheduleSave = () => {}; w.__app.flushSave = () => {}; } catch (e) {}
  log('iframe: ' + w.location.href);

  // ── ① 프롬프트에 inputKind·도면 충실도 규칙이 실려 있는지 (배포된 ai.js 그대로)
  let src = '';
  try { src = await (await fetch('./js/ai.js?v=59')).text(); } catch (e) {}
  check('프롬프트: inputKind 판별 단계', src.includes('inputKind') && src.includes('1) inputKind'));
  check('프롬프트: 도면 충실도·상상 금지', src.includes('도면 충실도 절대 원칙') && src.includes('상상·추측 금지'));
  check('프롬프트: 단품 노즐 0.15~0.35m 마감', src.includes('0.15~0.35m'));
  check('프롬프트: photo 모드 자연 연결 유지', src.includes('inputKind: \\"photo\\"') || src.includes('■ inputKind: "photo"'));
  check('프롬프트: 출력 JSON에 inputKind', src.includes('[출력 형식 — inputKind를 맨 앞') && src.includes('inputKind'));

  // ── ② 도면(drawing): 노즐 끝을 그대로 둔다
  const dc = sanitizeAiScene(DRAWING);
  const dpipes = dc.pipes;
  result.detail.drawing = { report: dc.report, pipes: dpipes.map((p) => ({ name: p.name, len: +pipeLen(p).toFixed(3), pts: p.points })) };
  log('drawing report: ' + JSON.stringify(dc.report));
  check('도면: inputKind 유지', dc.inputKind === 'drawing' && dc.report.inputKind === 'drawing', dc.inputKind);
  check('도면: 노즐 4개 그대로', dpipes.length === 4, `${dpipes.length}개`);
  const lens = dpipes.map(pipeLen);
  check('도면: 노즐 길이 0.15~0.35m 유지', lens.every((L) => L >= 0.149 && L <= 0.351),
    lens.map((L) => L.toFixed(3)).join(' / '));
  const changed = ['N1', 'N2', 'N3', 'N4'].filter((n, k) => {
    const p = dpipes.find((q) => q.name.startsWith(`N${k + 1}`));
    const orig = DRAWING.pipes[k];
    return !p || !ends(p).every((e, ei) => near(e, orig.points[ei === 0 ? 0 : orig.points.length - 1], 0.002));
  });
  check('도면: 노즐 끝 좌표 원본 그대로', changed.length === 0, changed.join(',') || 'N1~N4 그대로');
  check('도면: 자동 연결 없음', dc.report.branched === 0 && dc.report.snapped === 0 && dc.report.welded === 0,
    `branched=${dc.report.branched} snapped=${dc.report.snapped} welded=${dc.report.welded}`);
  check('도면: 없는 부품 안 만듦(장비 5 = 열교환기+플랜지4)', dc.equipment.length === 5
    && !dc.equipment.some((e) => ['valve', 'gauge', 'support', 'tank', 'stank', 'header'].includes(e.type)),
  `${dc.equipment.length}개`);
  check('도면: 열린 끝 4곳 도면대로', dc.report.drawHeld === 4, `drawHeld=${dc.report.drawHeld}`);

  // ── ③ photo: 짧은 장비 노즐끼리 꺾어 붙이지 않는다
  const pn = sanitizeAiScene(PHOTO_NOZZLE);
  result.detail.photoNozzle = { report: pn.report, pipes: pn.pipes };
  log('photo nozzle report: ' + JSON.stringify(pn.report));
  const nEndsKept = pn.pipes.every((p, k) => ends(p).every((e) => near(e, PHOTO_NOZZLE.pipes[k].points[PHOTO_NOZZLE.pipes[k].points.length - 1], 0.002)
    || near(e, PHOTO_NOZZLE.pipes[k].points[0], 0.002)));
  check('사진: 짧은 노즐(0.4m↓) 서로 안 붙임', nEndsKept && pn.report.nozzleKept === 2,
    `nozzleKept=${pn.report.nozzleKept} branched=${pn.report.branched}`);
  check('사진: 노즐 길이 0.3m 유지', pn.pipes.every((p) => Math.abs(pipeLen(p) - 0.3) < 0.002),
    pn.pipes.map((p) => pipeLen(p).toFixed(3)).join(' / '));

  // ── ④ photo: ㄷ자 분기 자동 연결이 그대로 동작 (v58 회귀)
  const pb = sanitizeAiScene(PHOTO_BRANCH);
  result.detail.photoBranch = pb.report;
  const A = pb.pipes.find((p) => p.name.includes('우회 A'));
  const B = pb.pipes.find((p) => p.name.includes('우회 B'));
  const endA = A.points[A.points.length - 1];
  const endB = B.points[B.points.length - 1];
  log('photo branch report: ' + JSON.stringify(pb.report) + ` endA=${JSON.stringify(endA)} endB=${JSON.stringify(endB)}`);
  check('사진: ㄷ자 A 후면관 중심선', Math.abs(endA.y - 1.35) < 0.002 && Math.abs(endA.z - 1.3) < 0.002,
    `y=${endA.y} z=${endA.z}`);
  check('사진: ㄷ자 B 중심선·수직', Math.abs(endB.y - 1.35) < 0.002 && Math.abs(endB.z - 1.3) < 0.002,
    `y=${endB.y} z=${endB.z}`);
  check('사진: ㄷ자 연결 2곳 보고', pb.report.branched === 2, `branched=${pb.report.branched}`);
  check('사진: 게이트밸브 수직 유지', pb.equipment.filter((e) => e.type === 'valve' && e.axis === 'y').length === 2);

  // ── ⑤ 라이브 앱에 사진(노즐) 씬을 먼저 적용 — 앱이 쓰는 store.js도 최신인지 확인
  const app = w.__app;
  app.applyAIResult(PHOTO_NOZZLE, 'replace');
  const stN = JSON.parse(JSON.stringify(app.state));
  const stNLen = stN.pipes.map((p) => { let L = 0; for (let i = 1; i < p.points.length; i += 1) { const a = p.points[i - 1], b = p.points[i]; L += Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z); } return L; });
  result.detail.photoNozzleApp = stNLen;
  check('앱: 짧은 노즐 0.3m 유지(꾸어지지 않음)', stN.pipes.length === 2 && stNLen.every((L) => Math.abs(L - 0.3) < 0.002),
    stNLen.map((L) => L.toFixed(3)).join(' / '));

  // ── ⑥ 라이브 앱에 도면 씬을 적용 → 렌더링 (미리보기)
  app.applyAIResult(DRAWING, 'replace');
  app.setView('iso', true);
  try { app.setDrawerOpen(false); app.setDims(true); } catch (e) {}
  try {
    const t = app.controls.target.clone();
    const off = app.camera.position.clone().sub(t).multiplyScalar(0.72);
    t.y -= 0.1;
    app.controls.target.copy(t);
    app.camera.position.copy(t.clone().add(off));
    app.controls.update();
  } catch (e) {}
  const st = JSON.parse(JSON.stringify(app.state));
  result.detail.counts = { equipment: st.equipment.length, pipes: st.pipes.length };
  const stLens = st.pipes.map((p) => { let L = 0; for (let i = 1; i < p.points.length; i += 1) { const a = p.points[i - 1], b = p.points[i]; L += Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z); } return L; });
  check('적용된 씬: 장비 5 · 배관 4', st.equipment.length === 5 && st.pipes.length === 4,
    `${st.equipment.length} / ${st.pipes.length}`);
  check('적용된 씬: 노즐 길이 유지', stLens.every((L) => L >= 0.149 && L <= 0.351),
    stLens.map((L) => L.toFixed(3)).join(' / '));
  check('적용된 씬: NaN 좌표 0개',
    !st.pipes.some((p) => p.points.some((q) => !isFinite(q.x) || !isFinite(q.y) || !isFinite(q.z)))
    && !st.equipment.some((e) => !isFinite(e.x) || !isFinite(e.y) || !isFinite(e.z)));

  // ── ⑦ 콘솔 오류
  await new Promise((r) => setTimeout(r, 900));
  const errs = (w.__errors || []).concat(window.__errs);
  result.detail.errors = errs;
  check('콘솔 오류 0건', errs.length === 0, errs.length ? errs.slice(0, 3).join(' | ') : '0건');

  lines.push('<div class="dim">drawing 노즐 4 · photo ㄷ자 2곳 · photo 노즐 2곳 유지</div>');
  linesEl.innerHTML = lines.join('');
  window.__done = true;
  log('\n결과: ' + (result.ok ? '전 항목 OK' : 'NG 있음'));
}

fr.addEventListener('load', () => {
  const w = fr.contentWindow;
  w.addEventListener('error', (e) => window.__errs.push('error: ' + (e.message || e.type)));
  w.addEventListener('unhandledrejection', (e) => window.__errs.push('rejection: ' + ((e.reason && e.reason.message) || e.reason)));
  const ce = w.console.error.bind(w.console);
  w.console.error = (...a) => { window.__errs.push('console.error: ' + a.map(String).join(' ')); ce(...a); };
  setTimeout(() => run().catch((e) => { log('실행 오류: ' + (e && e.stack || e)); check('검증 실행', false, String(e && e.message || e)); }), 400);
});
</script>
</body>
</html>
