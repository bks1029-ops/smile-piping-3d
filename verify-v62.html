<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>v62 검증 — 노즐 직접 터치 전환 (390×844 · 장비 6종)</title>
<style>
  body { margin: 0; background: #14181d; color: #dfe6ee; font: 12px/1.5 ui-monospace, monospace; display: flex; gap: 10px; padding: 8px; align-items: flex-start; }
  #fr { width: 390px; height: 844px; border: 0; background: #000; flex: 0 0 auto; }
  #log { flex: 1; white-space: pre-wrap; margin: 0; font-size: 12.5px; min-width: 320px; }
  .ok { color: #6ee7a0; }
  .ng { color: #ff8a7a; }
  b { color: #ffd479; }
  #shotBox { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
  #shot, #shot2 { display: block; border: 1px solid #2b3440; }
  #cap { align-self: flex-start; background: #f5a623; color: #14181d; border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<iframe id="fr" src="./index.html?v=62" width="390" height="844"></iframe>
<pre id="log">검증 준비 중...</pre>
<div id="shotBox">
  <button id="cap" hidden>📸 390×844 캡처</button>
  <div id="capInfo"></div>
  <img id="shot" alt="">
  <img id="shot2" alt="">
</div>
<script type="module">
const results = [];
const logEl = document.getElementById('log');
logEl.textContent = '';
const say = (ok, label, detail) => {
  results.push({ ok: !!ok, label, detail: detail == null ? '' : String(detail) });
  const line = document.createElement('span');
  line.className = ok ? 'ok' : 'ng';
  line.textContent = `${ok ? 'PASS' : 'FAIL'} · ${label}${detail != null ? ' — ' + detail : ''}\n`;
  logEl.appendChild(line);
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = document.getElementById('fr');
const r3 = (v) => Math.round(Number(v) * 1000) / 1000;
const near1mm = (a, b) => !!a && !!b && Math.abs(a.x - b.x) <= 0.001 && Math.abs(a.y - b.y) <= 0.001 && Math.abs(a.z - b.z) <= 0.001;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
const fmtP = (p) => p ? `(${r3(p.x)}, ${r3(p.y)}, ${r3(p.z)})` : '-';
const overlapArea = (a, b) => {
  const w = Math.min(a.right, b.right) - Math.max(a.left, b.left);
  const h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
  return w > 0 && h > 0 ? w * h : 0;
};

async function ready() {
  for (let i = 0; i < 120; i += 1) {
    const W = frame.contentWindow;
    if (W && W.__app && W.__app.root && W.document.querySelector('#scene')) return W;
    await sleep(100);
  }
  throw new Error('앱이 12초 안에 뜨지 않았습니다');
}

(async () => {
  try {
    const W = await ready();
    const app = W.__app;
    const doc = W.document;
    const S = await import('./js/store.js?v=62');
    say(true, '앱 로드', `390×844 iframe · ${W.innerWidth}×${W.innerHeight}`);
    say((W.__errors || []).length === 0, '시작 시 콘솔 에러 0건', (W.__errors || []).length);

    const canvas = app.renderer.domElement;
    const lastPipe = () => app.state.pipes[app.state.pipes.length - 1];
    const lastToast = () => {
      const t = doc.querySelectorAll('#toastHost .toast');
      return t.length ? t[t.length - 1].textContent.trim() : '';
    };

    // 월드 좌표 → iframe 화면 좌표 (앱 nozzlePickAt과 같은 투영)
    const toScreen = (p) => {
      const r = canvas.getBoundingClientRect();
      const v = app.camera.position.clone().set(p.x, p.y, p.z).project(app.camera);
      return { x: (v.x * 0.5 + 0.5) * r.width + r.left, y: (-v.y * 0.5 + 0.5) * r.height + r.top, z: v.z };
    };
    // 3D 화면을 손가락으로 톡 누르는 것과 같은 포인터 이벤트
    // 합성 포인터에는 브라우저가 아는 '진짜 손가락'이 없어 OrbitControls의 setPointerCapture가
    // NotFoundError를 던진다(실제 터치에서는 나지 않는 검사 도구의 부작용). 그 한 줄만 무력화하고,
    // 실제 터치(진짜 포인터)로는 아래 '진짜 클릭' 검사에서 따로 확인한다.
    canvas.setPointerCapture = () => {};
    canvas.releasePointerCapture = () => {};
    const tap = async (pt, off) => {
      const s = toScreen(pt);
      const x = Math.round(s.x + ((off && off.x) || 0));
      const y = Math.round(s.y + ((off && off.y) || 0));
      const ev = { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 7, pointerType: 'touch', isPrimary: true };
      canvas.dispatchEvent(new W.PointerEvent('pointerdown', ev));
      canvas.dispatchEvent(new W.PointerEvent('pointerup', ev));
      await sleep(70);
      return { x, y };
    };
    const panelHidden = () => !!doc.querySelector('#props').hidden;
    const panelShown = () => !doc.querySelector('#props').hidden;

    // 장비 한 대만 놓고 그 장비를 검사한다. 바닥에서 띄워(y=2.0) 아래 노즐도 그릴 자리가 있게.
    const setup = async (type, cfg) => {
      app.setHandMode(false);
      app.clearAll({ silent: true });
      await sleep(80);
      app.addEquipment(type);
      const spec = app.state.equipment[app.state.equipment.length - 1];
      Object.assign(spec, { x: 0, y: 2.0, z: 0, rot: 0 }, cfg || {});
      app.refreshScene();
      app.setDims(false);
      app.setView('iso', true);
      await sleep(100);
      return spec;
    };

    const NOZ = { up: '100A', down: '50A', left: '80A', right: '125A' };
    const DEV = [
      { type: 'pump', label: '원심펌프', nz: { in: '200A', out: '150A' }, size: { w: 1.15, h: 0.85, d: 0.6 } },
      { type: 'hx', label: '열교환기', nz: NOZ, size: { w: 3.0, h: 0.75 } },
      { type: 'header', label: '헤더', nz: NOZ, size: { w: 2.4, h: 0.4 } },
      { type: 'tank', label: '탱크/드럼', nz: NOZ, size: { w: 0.6, h: 0.9 } },
      { type: 'stank', label: '대형 원통탱크', nz: NOZ, size: { w: 2.0, h: 3.0 } },
      { type: 'rtank', label: '사각 탱크', nz: NOZ, size: { w: 2.4, h: 1.8, d: 1.8 } },
    ];

    // ── ① 6종 장비 × 모든 노즐 방향: 노즐 끝을 직접 터치 → 그 노즐로 전환 ──────────
    for (const dev of DEV) {
      const spec = await setup(dev.type, Object.assign({ nozzles: dev.nz }, dev.size));
      const list = S.equipNozzles(spec);
      say(list.length === Object.keys(dev.nz).length, `${dev.label} 노즐 ${list.length}곳 활성`,
        list.map((n) => `${S.NOZZLE_LABELS[n.dir]} ${n.bore} ${fmtP(n.tip)}`).join(' / '));

      // ── 본체 터치: 기존처럼 기본 노즐(펌프 OUT · 나머지 첫 방향) + 속성 창 열기 ──
      // (배관을 그리기 전에 한다 — 배관이 본체 위를 지나면 그 배관이 먼저 잡히는 게 맞는 동작)
      const want = dev.type === 'pump' ? (list.find((n) => n.dir === 'out') || list[0]) : list[0];
      app.clearSelection();
      await sleep(60);
      await tap({ x: spec.x, y: (spec.y || 0) + Math.min(0.4, (spec.h || 0.3) * 0.5), z: spec.z });
      const bcur = { ...app.cmdCursor };
      say(near1mm(bcur, want.tip) && app.cmdBore === want.bore,
        `${dev.label} 본체 터치 → 기본 ${S.NOZZLE_LABELS[want.dir]} 노즐`,
        `커서 ${fmtP(bcur)} · ${app.cmdBore} (기대 ${want.bore} ${fmtP(want.tip)})`);
      say(panelShown(), `${dev.label} 본체 터치 → 속성 창 열림`, panelShown() ? '열림' : '닫힘');

      for (const n of list) {
        app.clearSelection();
        await sleep(40);
        const before = app.state.pipes.length;
        const t = await tap(n.tip);
        const cur = { ...app.cmdCursor };
        const dv = app.lastDirV || {};
        const axisOk = Math.abs(dv.x - n.axis.x) < 0.011 && Math.abs(dv.y - n.axis.y) < 0.011 && Math.abs(dv.z - n.axis.z) < 0.011;
        const selOk = app.selection && app.selection.kind === 'equipment' && app.selection.id === spec.id;
        const tapLabel = `${dev.label} ${S.NOZZLE_LABELS[n.dir]} 노즐 터치`;
        say(selOk, `${tapLabel} → 그 장비 선택`, app.selection ? `${app.selection.kind}:${app.selection.id === spec.id ? '맞음' : '다른 장비'}` : '선택 없음');
        say(near1mm(cur, n.tip), `${tapLabel} → 커서 = 그 노즐 끝`,
          `화면 (${t.x}, ${t.y}) · 커서 ${fmtP(cur)} · 노즐 ${fmtP(n.tip)} · 오차 ${(dist(cur, n.tip) * 1000).toFixed(2)}mm`);
        say(app.cmdBore === n.bore, `${tapLabel} → 관경 ${n.bore}`, `지금 ${app.cmdBore}`);
        say(axisOk, `${tapLabel} → 방향 = 노즐 바깥`, `${fmtP(dv)} vs ${fmtP(n.axis)}`);
        const toast = lastToast();
        const labelPart = S.NOZZLE_LABELS[n.dir].split(' ').pop();
        say(toast.includes(labelPart) && toast.includes(n.bore) && /이어 그립니다/.test(toast),
          `${tapLabel} → 토스트 안내`, toast.slice(0, 70));
        say(panelHidden(), `${tapLabel} → 속성 창은 접힘(바로 그리기)`, panelHidden() ? 'hidden' : '열려 있음');

        // 터치한 그 노즐에서 조이스틱으로 이어 그리기 — 배관 시작점·관경이 그 노즐 것인가
        const ax = Math.abs(n.axis.y) > Math.max(Math.abs(n.axis.x), Math.abs(n.axis.z)) ? 'y'
          : (Math.abs(n.axis.x) >= Math.abs(n.axis.z) ? 'x' : 'z');
        const sgn = (ax === 'x' ? n.axis.x : ax === 'z' ? n.axis.z : n.axis.y) < 0 ? -1 : 1;
        app.padDraw({ op: 'seg', axis: ax, sign: sgn }, 0.8);
        await sleep(60);
        const p = lastPipe();
        const started = p && app.state.pipes.length > before ? p.points[0] : null;
        say(!!started && near1mm(started, n.tip), `${tapLabel} → 조이스틱 배관이 그 노즐 끝에서 시작`,
          started ? `${fmtP(started)} · 오차 ${(dist(started, n.tip) * 1000).toFixed(2)}mm · ${p.bore}` : '배관 없음');
        say(!!p && p.bore === n.bore && app.state.pipes.length > before, `${tapLabel} → 배관 관경 ${n.bore}`, p ? p.bore : '-');
      }

      // ── 속성 창 📍 버튼도 그대로: 누른 방향 노즐 끝으로 ──
      for (const n of list) {
        app.select('equipment', spec.id);
        await sleep(50);
        const btn = doc.querySelector(`#propBody [data-act="noz"][data-dir="${n.dir}"]`);
        if (!btn) { say(false, `${dev.label} 📍 ${n.dir} 버튼 없음`); continue; }
        btn.click();
        await sleep(60);
        const c2 = { ...app.cmdCursor };
        say(near1mm(c2, n.tip) && app.cmdBore === n.bore, `${dev.label} 속성 창 📍 ${S.NOZZLE_LABELS[n.dir]} → 그 노즐 끝`,
          `커서 ${fmtP(c2)} · ${app.cmdBore} · 오차 ${(dist(c2, n.tip) * 1000).toFixed(2)}mm`);
      }
    }

    // ── ② 터치 판정 범위: 노즐에서 25px 떨어져도 노즐 터치 / 40px은 본체 선택 ─────────
    const hx = await setup('hx', Object.assign({ nozzles: NOZ }, { w: 3.0, h: 0.75 }));
    const hxList = S.equipNozzles(hx);
    const rightN = hxList.find((n) => n.dir === 'right');
    const downN = hxList.find((n) => n.dir === 'down');

    app.clearSelection();
    await sleep(50);
    await tap(rightN.tip, { x: 25, y: 0 });   // 오른쪽으로 25px — 32px 안
    const n25 = { ...app.cmdCursor };
    say(near1mm(n25, rightN.tip) && app.cmdBore === rightN.bore,
      '노즐 끝에서 25px 떨어진 터치도 그 노즐로', `커서 ${fmtP(n25)} · ${app.cmdBore} (기대 ${rightN.bore})`);

    app.clearSelection();
    await sleep(50);
    await tap(downN.tip, { x: 0, y: 40 });    // 위로 40px — 판정 밖(본체 쪽)
    const n40 = { ...app.cmdCursor };
    const downHit = near1mm(n40, downN.tip) && app.cmdBore === downN.bore;
    say(!downHit, '노즐에서 40px 떨어진 터치는 그 노즐로 전환하지 않음',
      `커서 ${fmtP(n40)} · ${app.cmdBore} (아래 노즐 ${downN.bore} ${fmtP(downN.tip)})`);

    // 빈 바닥 터치 — 선택 없음, 에러 없음
    app.clearSelection();
    await sleep(50);
    const gr = canvas.getBoundingClientRect();
    const ev0 = { bubbles: true, cancelable: true, clientX: Math.round(gr.left + gr.width * 0.06), clientY: Math.round(gr.top + gr.height * 0.94), pointerId: 7, pointerType: 'touch', isPrimary: true };
    canvas.dispatchEvent(new W.PointerEvent('pointerdown', ev0));
    canvas.dispatchEvent(new W.PointerEvent('pointerup', ev0));
    await sleep(60);
    say(!app.selection, '빈 곳 터치 → 선택 없음', app.selection ? '선택 남음' : '없음');

    // ── ③ 노즐을 직접 눌러 이어 그린 뒤 꺾기 — 엘보가 그 노즐 끝에 ──────────────────
    const hx2 = await setup('hx', Object.assign({ nozzles: NOZ }, { w: 3.0, h: 0.75 }));
    const upN = S.equipNozzles(hx2).find((n) => n.dir === 'up');
    app.clearSelection();
    await sleep(50);
    await tap(upN.tip);
    const eqBefore = app.state.equipment.filter((e) => e.type === 'elbow').length;
    // 노즐에서 바로 꺾는다 — 엘보가 그 노즐 끝에 앉고 배관이 그 면에서 시작
    app.padDraw({ op: 'seg', axis: 'x', sign: 1 }, 1.2);
    await sleep(80);
    const elbows = app.state.equipment.filter((e) => e.type === 'elbow');
    const elb = elbows.length > eqBefore ? elbows[elbows.length - 1] : null;
    say(!!elb && near1mm(elb, upN.tip), '노즐 터치 후 꺾기 — 엘보가 그 노즐 끝에',
      elb ? `${fmtP(elb)} · 오차 ${(dist(elb, upN.tip) * 1000).toFixed(2)}mm` : '엘보 없음');

    // ── ④ 명령창으로도 이어 그리기 ─────────────────────────────────────────────
    const pump = await setup('pump', Object.assign({ nozzles: { in: '200A', out: '150A' } }, { w: 1.15, h: 0.85, d: 0.6 }));
    const inN = S.equipNozzles(pump).find((n) => n.dir === 'in');
    app.clearSelection();
    await sleep(50);
    await tap(inN.tip);
    const beforeCmd = app.state.pipes.length;
    app.runCommandLine('앞으로 1200');
    await sleep(80);
    const pc = lastPipe();
    const startCmd = pc && app.state.pipes.length > beforeCmd ? pc.points[0] : null;
    say(!!startCmd && near1mm(startCmd, inN.tip) && pc.bore === inN.bore,
      '흡입(IN) 노즐 터치 → 명령 "앞으로 1200" 이 그 끝에서',
      startCmd ? `${fmtP(startCmd)} · 오차 ${(dist(startCmd, inN.tip) * 1000).toFixed(2)}mm · ${pc.bore}` : '배관 없음');

    // ── ⑤ 레이아웃 · 콘솔 에러 ─────────────────────────────────────────────────
    const tank = await setup('tank', Object.assign({ nozzles: NOZ }, { w: 0.6, h: 0.9 }));
    app.select('equipment', tank.id);
    await sleep(200);
    const props = doc.querySelector('#props').getBoundingClientRect();
    const topbar = doc.querySelector('#topbar').getBoundingClientRect();
    say(overlapArea(props, topbar) === 0, '상단 바 ↔ 속성 패널 겹침 0px²', overlapArea(props, topbar).toFixed(1));
    const bodyEl = doc.querySelector('#propBody');
    say(bodyEl.scrollWidth - bodyEl.clientWidth <= 1, '속성 패널 가로 넘침 없음', `${bodyEl.scrollWidth} vs ${bodyEl.clientWidth}`);
    say((W.__errors || []).length === 0, '검증 중 콘솔 에러 0건', JSON.stringify(W.__errors || []));

    // ── ⑥ 시연 씬 (스크린샷용) — 터치한 노즐에서 이어 그린 배관들 ────────────────
    app.clearAll({ silent: true });
    await sleep(100);
    const add = (type, cfg) => {
      app.addEquipment(type);
      const s = app.state.equipment[app.state.equipment.length - 1];
      Object.assign(s, cfg);
      return s;
    };
    const hxd = add('hx', { x: -2.6, y: 0, z: -0.4, w: 3.4, h: 0.8, rot: 0, nozzles: { up: '100A', down: '50A', left: '80A', right: '80A' } });
    const tankd = add('tank', { x: 2.6, y: 0, z: -1.2, w: 0.8, h: 1.4, rot: 0, nozzles: { up: '50A', down: '50A', left: '80A', right: '80A' } });
    const pumpd = add('pump', { x: 1.5, y: 0, z: 1.8, rot: 0, nozzles: { in: '200A', out: '150A' } });
    app.refreshScene();
    app.setDims(false);
    app.setView('iso', true);
    await sleep(120);
    // 장비 노즐을 실제로 톡 눌러(tap) 그 자리에서 이어 그린다 — v62가 하는 일 그대로
    const drawByTap = async (spec, dir, segs) => {
      const n = S.equipNozzles(spec).find((x) => x.dir === dir);
      if (!n) return null;
      app.clearSelection();
      await sleep(40);
      await tap(n.tip);
      segs.forEach((s2) => app.padDraw(s2, s2.m));
      await sleep(40);
      return n;
    };
    await drawByTap(hxd, 'up', [{ op: 'seg', axis: 'y', sign: 1, m: 1.0 }, { op: 'seg', axis: 'x', sign: 1, m: 1.5 }]);
    await drawByTap(hxd, 'right', [{ op: 'seg', axis: 'x', sign: 1, m: 1.1 }]);
    await drawByTap(tankd, 'left', [{ op: 'seg', axis: 'x', sign: -1, m: 1.3 }]);
    await drawByTap(pumpd, 'out', [{ op: 'seg', axis: 'y', sign: 1, m: 1.2 }, { op: 'seg', axis: 'x', sign: -1, m: 1.4 }]);
    await drawByTap(pumpd, 'in', [{ op: 'seg', axis: 'z', sign: 1, m: 1.0 }]);
    app.setView('iso', true);
    await sleep(150);
    // 마지막으로 열교환기 왼쪽 노즐을 터치한 상태로 둔다 — 커서가 그 노즐 끝에
    app.clearSelection();
    await sleep(50);
    const hxLeft = S.equipNozzles(hxd).find((n) => n.dir === 'left');
    await tap(hxLeft.tip);
    await sleep(120);
    const shotCursor = fmtP(app.cmdCursor);
    say(near1mm(app.cmdCursor, hxLeft.tip), '시연 씬: 열교환기 왼쪽 노즐 터치 상태',
      `커서 ${shotCursor} · 노즐 ${fmtP(hxLeft.tip)} · 장비 ${app.state.equipment.length} · 배관 ${app.state.pipes.length} · 토스트 "${lastToast().slice(0, 50)}"`);

    // 이제부터는 진짜 터치·클릭 검사 — 합성 이벤트용으로 껴 둔 포인터 캡처를 되둘린다.
    delete canvas.setPointerCapture;
    delete canvas.releasePointerCapture;
    window.__probe = {
      tips: () => {
        const r = canvas.getBoundingClientRect();
        const fr = document.getElementById('fr').getBoundingClientRect();
        const out = [];
        [[hxd, '열교환기'], [tankd, '탱크'], [pumpd, '펌프']].forEach(([spec, label]) => {
          S.equipNozzles(spec).forEach((n) => {
            const v = app.camera.position.clone().set(n.tip.x, n.tip.y, n.tip.z).project(app.camera);
            out.push({
              label, dir: n.dir, bore: n.bore, tip: { ...n.tip },
              x: fr.left + r.left + (v.x * 0.5 + 0.5) * r.width,
              y: fr.top + r.top + (-v.y * 0.5 + 0.5) * r.height,
            });
          });
        });
        return { frameTop: fr.top, frameLeft: fr.left, tips: out };
      },
      state: () => ({
        cursor: { ...app.cmdCursor }, bore: app.cmdBore,
        sel: app.selection ? `${app.selection.kind}:${app.selection.id}` : null,
        propsHidden: !!doc.querySelector('#props').hidden,
        toast: lastToast(), errors: (W.__errors || []).slice(),
      }),
      resetSelection: () => app.clearSelection(),
      errors: () => (W.__errors || []).slice(),
    };

    // 📸 버튼 — 캔버스 픽셀을 <img>로 복사(iframe 캔버스는 일반 화면 캡처에 안 담겨서)
    const capBtn = document.getElementById('cap');
    const shotBox = document.getElementById('shotBox');
    capBtn.hidden = false;
    capBtn.addEventListener('click', () => {
      const zoomShot = (imgId, target, dd) => {
        const cam = app.camera;
        const dir = cam.position.clone().sub(app.controls.target).normalize();
        const p0 = cam.position.clone();
        const t0 = app.controls.target.clone();
        app.controls.target.copy(target);
        cam.position.copy(target).addScaledVector(dir, dd);
        app.controls.update();
        app.renderer.render(app.scene, cam);
        document.getElementById(imgId).src = canvas.toDataURL('image/png');
        cam.position.copy(p0);
        app.controls.target.copy(t0);
        app.controls.update();
      };
      app.renderer.render(app.scene, app.camera);
      const r = canvas.getBoundingClientRect();
      const img = document.getElementById('shot');
      img.src = canvas.toDataURL('image/png');
      img.width = Math.round(r.width);
      img.height = Math.round(r.height);
      // 터치한 왼쪽 노즐 끝에 커서가 붙은 자리 확대
      zoomShot('shot2', { x: -2.9, y: 0.55, z: -0.4 }, 2.6);
      document.getElementById('capInfo').textContent =
        `canvas ${Math.round(r.width)}×${Math.round(r.height)} · 화면 ${W.innerWidth}×${W.innerHeight} · canvas top ${Math.round(r.top)}`;
      shotBox.scrollIntoView({ block: 'nearest' });
    });

    const fails = results.filter((r) => !r.ok).length;
    window.__results = results;
    const sum = doc.createElement('div');
    sum.innerHTML = `\n<b>합계: ${results.length - fails}/${results.length} PASS${fails ? ` · FAIL ${fails}` : ''}</b>\n`;
    logEl.appendChild(sum);
    window.__summary = { total: results.length, fails };
  } catch (e) {
    say(false, '검증 스크립트 예외', e && e.message ? e.message : e);
    window.__results = results;
    window.__summary = { total: results.length, fails: 1 };
  }
})();
</script>
</body>
</html>
