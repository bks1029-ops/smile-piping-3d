<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>v61 검증 — 장비 커서 노즐 밀착 (390×844)</title>
<style>
  body { margin: 0; background: #14181d; color: #dfe6ee; font: 12px/1.5 ui-monospace, monospace; display: flex; gap: 10px; padding: 8px; align-items: flex-start; }
  #fr { width: 390px; height: 844px; border: 0; background: #000; flex: 0 0 auto; }
  #log { flex: 1; white-space: pre-wrap; margin: 0; font-size: 12.5px; }
  .ok { color: #6ee7a0; }
  .ng { color: #ff8a7a; }
  b { color: #ffd479; }
  #shotBox { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
  #shot { display: block; border: 1px solid #2b3440; }
  #cap { align-self: flex-start; background: #f5a623; color: #14181d; border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<iframe id="fr" src="./index.html?v=61" width="390" height="844"></iframe>
<pre id="log">검증 준비 중...</pre>
<div id="shotBox">
  <button id="cap" hidden>📸 390×844 캡처</button>
  <div id="capInfo"></div>
  <img id="shot" alt="">
  <img id="shot2" alt="">
</div>
<script type="module">
const results = [];
const logEl = document.getElementById('log');
logEl.textContent = '';
const say = (ok, label, detail) => {
  results.push({ ok: !!ok, label, detail: detail == null ? '' : String(detail) });
  const line = document.createElement('span');
  line.className = ok ? 'ok' : 'ng';
  line.textContent = `${ok ? 'PASS' : 'FAIL'} · ${label}${detail != null ? ' — ' + detail : ''}\n`;
  logEl.appendChild(line);
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = document.getElementById('fr');
const r3 = (v) => Math.round(Number(v) * 1000) / 1000;
// 1mm 이내 = 소수 셋째 자리에서 반올림해 같으면 같은 자리
const near1mm = (a, b) => Math.abs(a.x - b.x) <= 0.001 && Math.abs(a.y - b.y) <= 0.001 && Math.abs(a.z - b.z) <= 0.001;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
const fmtP = (p) => p ? `(${r3(p.x)}, ${r3(p.y)}, ${r3(p.z)})` : '-';
const overlapArea = (a, b) => {
  const w = Math.min(a.right, b.right) - Math.max(a.left, b.left);
  const h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
  return w > 0 && h > 0 ? w * h : 0;
};

async function ready() {
  for (let i = 0; i < 120; i += 1) {
    const W = frame.contentWindow;
    if (W && W.__app && W.__app.root && W.document.querySelector('#scene')) return W;
    await sleep(100);
  }
  throw new Error('앱이 12초 안에 뜨지 않았습니다');
}

(async () => {
  try {
    const W = await ready();
    const app = W.__app;
    const doc = W.document;
    const S = await import('./js/store.js?v=61');
    say(true, '앱 로드', `390×844 iframe · ${W.innerWidth}×${W.innerHeight}`);
    say((W.__errors || []).length === 0, '시작 시 콘솔 에러 0건', (W.__errors || []).length);

    const lastPipe = () => app.state.pipes[app.state.pipes.length - 1];

    const setup = async (type, cfg) => {
      app.clearAll({ silent: true });
      await sleep(60);
      app.addEquipment(type);
      const spec = app.state.equipment[app.state.equipment.length - 1];
      Object.assign(spec, cfg);
      app.refreshScene();
      await sleep(60);
      return spec;
    };

    // ── ① 6종 장비: 선택만 해도 커서가 실제 노즐 끝에 붙는가 ────────────────
    // (plan: pump·hx·header·tank·stank·rtank — 펌프는 OUT 우선, 나머지는 첫 활성 노즐)
    const cases = [
      { type: 'pump', label: '원심펌프', word: '위로', turn: '오른쪽으로', cfg: { x: -1.6, z: 0, w: 1.15, h: 0.85, d: 0.6, rot: 0, nozzles: { in: '200A', out: '150A' } }, want: 'out' },
      { type: 'hx', label: '열교환기', word: '위로', turn: '오른쪽으로', cfg: { x: -1.6, z: 0, w: 3.0, h: 0.75, rot: 0, nozzles: { up: '100A', down: '50A', left: '80A', right: '80A' } }, want: 'up' },
      { type: 'header', label: '헤더', word: '위로', turn: '앞으로', cfg: { x: -1.6, z: 0, w: 2.4, h: 0.4, rot: 0, nozzles: { up: '150A', down: '50A' } }, want: 'up' },
      { type: 'tank', label: '탱크/드럼', word: '위로', turn: '오른쪽으로', cfg: { x: -1.6, z: 0, w: 0.6, h: 0.9, rot: 0, nozzles: { up: '25A', left: '50A' } }, want: 'up' },
      { type: 'stank', label: '대형 저장탱크', word: '위로', turn: '왼쪽으로', cfg: { x: -1.6, z: 0, w: 2.0, h: 3.0, rot: 0, nozzles: { up: '100A', left: '100A' } }, want: 'up' },
      { type: 'rtank', label: '사각 탱크', word: '왼쪽으로', turn: '위로', cfg: { x: -1.6, z: 0, w: 2.4, h: 1.8, d: 1.8, rot: 0, nozzles: { left: '150A', right: '100A' } }, want: 'left' },
    ];

    for (const c of cases) {
      const spec = await setup(c.type, c.cfg);
      const list = S.equipNozzles(spec);
      const want = list.find((n) => n.dir === c.want) || list[0];

      // (a) 장비를 고르면(select) 커서가 노즐 끝
      app.select('equipment', spec.id);
      await sleep(50);
      const sel = { ...app.cmdCursor };
      say(!!want && near1mm(sel, want.tip), `${c.label} 선택 → 커서 = ${c.want} 노즐 끝`,
        `커서 ${fmtP(sel)} · 노즐 ${fmtP(want && want.tip)} · 차이 ${want ? (dist(sel, want.tip) * 1000).toFixed(2) : '-'}mm`);
      say(!!want && app.cmdBore === want.bore, `${c.label} 선택 → 관경 = 노즐 관경`,
        `${app.cmdBore} (기대 ${want && want.bore})`);
      const dv = app.lastDirV || {};
      const axisOk = !!want && Math.abs(dv.x - want.axis.x) < 0.01 && Math.abs(dv.y - want.axis.y) < 0.01 && Math.abs(dv.z - want.axis.z) < 0.01;
      say(axisOk, `${c.label} 선택 → 방향 = 노즐 바깥 방향`,
        `${fmtP(dv)} vs ${want ? fmtP(want.axis) : '-'}`);

      // (b) 📍 여기서 이어 그리기 버튼
      app.select('equipment', spec.id);
      await sleep(50);
      const fromBtn = doc.querySelector('#propBody [data-act="from"]');
      if (!fromBtn) { say(false, `${c.label} 📍 여기서 이어 그리기 버튼 없음`); continue; }
      fromBtn.click();
      await sleep(50);
      const fromCur = { ...app.cmdCursor };
      say(!!want && near1mm(fromCur, want.tip), `${c.label} 📍 여기서 이어 그리기 → 커서 = 노즐 끝`,
        `커서 ${fmtP(fromCur)} · 차이 ${want ? (dist(fromCur, want.tip) * 1000).toFixed(2) : '-'}mm`);

      // (c) 조이스틱으로 한 칸 — 배관 시작점이 그 노즐 끝(1mm 이내)
      const before = app.state.pipes.length;
      const padAxis = Math.abs(want.axis.y) > Math.max(Math.abs(want.axis.x), Math.abs(want.axis.z)) ? 'y'
        : (Math.abs(want.axis.x) >= Math.abs(want.axis.z) ? 'x' : 'z');
      const padSign = (padAxis === 'x' ? want.axis.x : padAxis === 'z' ? want.axis.z : want.axis.y) < 0 ? -1 : 1;
      app.padDraw({ op: 'seg', axis: padAxis, sign: padSign }, 1.0);
      await sleep(50);
      const p1 = lastPipe();
      const start1 = p1 && app.state.pipes.length > before ? p1.points[0] : null;
      say(!!start1 && near1mm(start1, want.tip), `${c.label} 조이스틱 배관 시작점 = 노즐 끝`,
        start1 ? `${fmtP(start1)} · 차이 ${(dist(start1, want.tip) * 1000).toFixed(2)}mm` : '배관 없음');
      say(!!p1 && p1.bore === want.bore, `${c.label} 조이스틱 배관 관경 = 노즐 관경`, p1 ? p1.bore : '-');

      // (d) 명령창 — 그 노즐이 뻗는 방향으로 1000mm: 배관 시작점이 노즐 끝
      app.select('equipment', spec.id);
      await sleep(50);
      const fromBtn2 = doc.querySelector('#propBody [data-act="from"]');
      fromBtn2.click();
      await sleep(50);
      const before2 = app.state.pipes.length;
      app.runCommandLine(`${c.word} 1000`);
      await sleep(50);
      const p2 = lastPipe();
      const start2 = p2 && app.state.pipes.length > before2 ? p2.points[0] : null;
      say(!!start2 && near1mm(start2, want.tip), `${c.label} 명령(${c.word} 1000) 배관 시작점 = 노즐 끝`,
        start2 ? `${fmtP(start2)} · 차이 ${(dist(start2, want.tip) * 1000).toFixed(2)}mm` : '배관 없음');

      // (e) 노즐에서 바로 꺾는 명령 — 엘보가 노즐 끝에 정확히 앉고 배관이 그 면에서 시작
      app.select('equipment', spec.id);
      await sleep(50);
      doc.querySelector('#propBody [data-act="from"]').click();
      await sleep(50);
      const eqBefore = app.state.equipment.filter((e) => e.type === 'elbow').length;
      app.runCommandLine(`${c.turn} 1000`);
      await sleep(50);
      const elbows = app.state.equipment.filter((e) => e.type === 'elbow');
      const elb = elbows.length > eqBefore ? elbows[elbows.length - 1] : null;
      say(!!elb && near1mm(elb, want.tip), `${c.label} 노즐에서 꺾는 명령 — 엘보가 노즐 끝에`, elb ? `${fmtP(elb)} · 차이 ${(dist(elb, want.tip) * 1000).toFixed(2)}mm` : '엘보 없음');
    }

    // ── ② 📍 위/아래/왼쪽/오른쪽 · IN/OUT 버튼이 각각 그 노즐 끝으로 ─────────
    const hx = await setup('hx', { x: -1.6, z: 0, w: 3.0, h: 0.75, rot: 0, nozzles: { up: '100A', down: '50A', left: '80A', right: '125A' } });
    const hxList = S.equipNozzles(hx);
    for (const dir of ['up', 'down', 'left', 'right']) {
      const want = hxList.find((n) => n.dir === dir);
      app.select('equipment', hx.id);
      await sleep(40);
      const btn = doc.querySelector(`#propBody [data-act="noz"][data-dir="${dir}"]`);
      if (!btn) { say(false, `열교환기 📍 ${dir} 버튼 없음`); continue; }
      btn.click();
      await sleep(40);
      const cur = { ...app.cmdCursor };
      say(!!want && near1mm(cur, want.tip) && app.cmdBore === want.bore, `열교환기 📍 ${dir} → 그 노즐 끝`,
        `커서 ${fmtP(cur)} · ${app.cmdBore} (기대 ${want && want.bore} ${want ? fmtP(want.tip) : ''})`);
    }

    const pump = await setup('pump', { x: 2.2, z: 1.8, w: 1.15, h: 0.85, d: 0.6, rot: 0, nozzles: { in: '200A', out: '150A' } });
    const pumpList = S.equipNozzles(pump);
    for (const dir of ['in', 'out']) {
      const want = pumpList.find((n) => n.dir === dir);
      app.select('equipment', pump.id);
      await sleep(40);
      const btn = doc.querySelector(`#propBody [data-act="noz"][data-dir="${dir}"]`);
      if (!btn) { say(false, `펌프 📍 ${dir} 버튼 없음`); continue; }
      btn.click();
      await sleep(40);
      const cur = { ...app.cmdCursor };
      say(!!want && near1mm(cur, want.tip) && app.cmdBore === want.bore, `펌프 📍 ${dir.toUpperCase()} → 그 노즐 끝`,
        `커서 ${fmtP(cur)} · ${app.cmdBore} (기대 ${want && want.bore} ${want ? fmtP(want.tip) : ''})`);
    }
    say(pumpList.length === 2 && dist(pumpList[0].tip, pumpList[1].tip) > 0.05,
      '펌프 IN·OUT 은 서로 다른 2곳', pumpList.map((n) => `${n.dir} ${fmtP(n.tip)}`).join(' / '));

    // ── ③ 예전 버그 자리(허공 0, 0.85, 0)에 커서가 뜨지 않는가 ─────────────
    const ghost = await setup('pump', { x: 0, z: 0, w: 1.15, h: 0.85, d: 0.6, rot: 0 });
    app.select('equipment', ghost.id);
    await sleep(50);
    const gcur = { ...app.cmdCursor };
    const ghostPt = { x: 0, y: 0.85, z: 0 };
    say(dist(gcur, ghostPt) > 0.05, '원점 펌프 — 허공 (0, 0.85, 0)에 커서 없음',
      `커서 ${fmtP(gcur)} · 허공과 ${(dist(gcur, ghostPt) * 1000).toFixed(0)}mm`);

    // ── ④ 노즐을 모두 끈 장비 — 엉뚱한 자리 대신 안내 ─────────────────────
    const off = await setup('tank', { x: -1.6, z: 0, w: 0.6, h: 0.9, rot: 0, nozzles: { up: 'none', down: 'none', left: 'none', right: 'none' } });
    app.select('equipment', off.id);
    await sleep(50);
    const curBefore = { ...app.cmdCursor };
    doc.querySelector('#propBody [data-act="from"]').click();
    await sleep(80);
    const toasts = doc.querySelectorAll('#toastHost .toast');
    const toastTxt = toasts.length ? toasts[toasts.length - 1].textContent : '';
    say(/노즐/.test(toastTxt) && near1mm(app.cmdCursor, curBefore), '노즐 없는 장비 — 커서 그대로 + 노즐 안내',
      toastTxt.trim().slice(0, 60));

    // ── ⑤ 레이아웃(390px) · 콘솔 에러 ─────────────────────────────────────
    const hx3 = await setup('hx', { x: -1.6, z: 0, w: 3.0, h: 0.75, rot: 0, nozzles: { up: '100A', down: '50A', left: '80A', right: '80A' } });
    app.select('equipment', hx3.id);
    await sleep(200);
    const props = doc.querySelector('#props').getBoundingClientRect();
    const topbar = doc.querySelector('#topbar').getBoundingClientRect();
    say(overlapArea(props, topbar) === 0, '상단 바 ↔ 속성 패널 겹침 0px²', overlapArea(props, topbar).toFixed(1));
    const bodyEl = doc.querySelector('#propBody');
    say(bodyEl.scrollWidth - bodyEl.clientWidth <= 1, '속성 패널 가로 넘침 없음', `${bodyEl.scrollWidth} vs ${bodyEl.clientWidth}`);
    say(props.bottom <= W.innerHeight + 1 && props.top >= topbar.bottom, '패널이 화면 안에 들어옴',
      `top ${Math.round(props.top)} / bottom ${Math.round(props.bottom)} / 화면 ${W.innerHeight}`);
    say((W.__errors || []).length === 0, '검증 중 콘솔 에러 0건', (W.__errors || []).length);

    // ── 시연 씬 (스크린샷용) — 커서가 노즐 끝에 딱 붙은 모습 ──────────────
    app.clearAll({ silent: true });
    await sleep(80);
    app.addEquipment('hx');
    const hxd = app.state.equipment[0];
    Object.assign(hxd, { x: -2.4, z: -0.5, w: 3.4, h: 0.8, rot: 0, nozzles: { up: '100A', down: '50A', left: '80A', right: '80A' } });
    app.addEquipment('pump');
    const pumpd = app.state.equipment[app.state.equipment.length - 1];
    Object.assign(pumpd, { x: 1.9, z: 1.7, rot: 0, nozzles: { in: '200A', out: '150A' } });
    app.refreshScene();
    await sleep(80);
    const drawAt = async (spec, dir, segs) => {
      app.select('equipment', spec.id);
      await sleep(40);
      const b = doc.querySelector(`#propBody [data-act="noz"][data-dir="${dir}"]`);
      if (!b) return;
      b.click();
      segs.forEach((s) => app.padDraw(s, s.m));
    };
    // 열교환기 위 100A: 위 1.0 → 오른쪽 1.6 (꺾임에 엘보 자동)
    await drawAt(hxd, 'up', [{ op: 'seg', axis: 'y', sign: 1, m: 1.0 }, { op: 'seg', axis: 'x', sign: 1, m: 1.6 }]);
    // 열교환기 오른쪽 80A: 오른쪽 1.4
    await drawAt(hxd, 'right', [{ op: 'seg', axis: 'x', sign: 1, m: 1.4 }]);
    // 펌프 OUT 150A: 위 1.1 → 왼쪽 1.3
    await drawAt(pumpd, 'out', [{ op: 'seg', axis: 'y', sign: 1, m: 1.1 }, { op: 'seg', axis: 'x', sign: -1, m: 1.3 }]);
    // 펌프 IN 200A: 앞 1.2
    await drawAt(pumpd, 'in', [{ op: 'seg', axis: 'z', sign: 1, m: 1.2 }]);
    app.setDims(false);
    app.setView('iso', true);
    await sleep(120);
    // 펌프를 고르면 커서가 OUT 노즐 끝에 — 패널은 닫아 3D를 가리지 않게
    app.select('equipment', pumpd.id);
    await sleep(150);
    const shotCursor = fmtP(app.cmdCursor);
    app.clearSelection();
    await sleep(250);
    say(true, '시연 씬 준비 완료', `장비 ${app.state.equipment.length}개 · 배관 ${app.state.pipes.length}개 · 커서 ${shotCursor}`);

    // 📸 버튼 — 캔버스 픽셀을 <img>로 복사(iframe 캔버스는 일반 화면 캡처에 안 담겨서)
    const capBtn = document.getElementById('cap');
    const shotBox = document.getElementById('shotBox');
    capBtn.hidden = false;
    capBtn.addEventListener('click', () => {
      const c = app.renderer.domElement;
      const zoomShot = (imgId, target, dist) => {
        const cam = app.camera;
        const dir = cam.position.clone().sub(app.controls.target).normalize();
        const p0 = cam.position.clone();
        const t0 = app.controls.target.clone();
        app.controls.target.copy(target);
        cam.position.copy(target).addScaledVector(dir, dist);
        cam.lookAt(target);
        app.renderer.render(app.scene, cam);
        const img = document.getElementById(imgId);
        img.src = c.toDataURL('image/png');
        cam.position.copy(p0);
        app.controls.target.copy(t0);
        app.controls.update();
      };
      // ① 전체 구도
      app.renderer.render(app.scene, app.camera);
      const r = c.getBoundingClientRect();
      const img = document.getElementById('shot');
      img.src = c.toDataURL('image/png');
      img.width = Math.round(r.width);
      img.height = Math.round(r.height);
      // ② 노즐 끝에 커서가 붙은 자리 확대 (핀치 줌과 같은 구도)
      zoomShot('shot2', { x: 2.02, y: 0.9, z: 1.7 }, 4.4);
      document.getElementById('capInfo').textContent =
        `canvas ${Math.round(r.width)}×${Math.round(r.height)} · 화면 ${W.innerWidth}×${W.innerHeight} · canvas top ${Math.round(r.top)}`;
      shotBox.scrollIntoView({ block: 'nearest' });
    });

    const fails = results.filter((r) => !r.ok).length;
    window.__results = results;
    const sum = doc.createElement('div');
    sum.innerHTML = `\n<b>합계: ${results.length - fails}/${results.length} PASS${fails ? ` · FAIL ${fails}` : ''}</b>\n`;
    logEl.appendChild(sum);
    window.__summary = { total: results.length, fails };
  } catch (e) {
    say(false, '검증 스크립트 예외', e && e.message ? e.message : e);
    window.__results = results;
    window.__summary = { total: results.length, fails: 1 };
  }
})();
</script>
</body>
</html>
